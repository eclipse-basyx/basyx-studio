# Local test environment for BaSyx Studio.
#
#   pnpm testenv:up      start everything and wait until healthy
#   pnpm testenv:smoke   verify targets, IdP configuration and access rules
#   pnpm testenv:down    stop and discard all data
#
# See README.md in this folder for targets, users and IdP configuration.
# All credentials in this folder are test-only values.

name: basyx-studio-testenv

x-basyx-env: &basyx-env
  SERVER_PORT: "5004"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: basyx
  POSTGRES_PASSWORD: basyx
  POSTGRES_MAXOPENCONNECTIONS: "20"
  POSTGRES_MAXIDLECONNECTIONS: "10"
  POSTGRES_CONNMAXLIFETIMEMINUTES: "5"
  POSTGRES_CONNMAXIDLETIMEMINUTES: "0"

services:
  # Studio metadata (database "studio") and the BaSyx databases share one server.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # OIDC test provider. The issuer must be identical for the browser, the Studio
  # BFF on the host and the BaSyx containers, hence keycloak.localhost (resolves
  # to loopback on the host; mapped to the host gateway inside containers).
  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.localhost:18080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "18080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  # --- Target "open": unsecured BaSyx Go AAS environment ----------------------
  basyx-open-schema:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_open
    depends_on:
      postgres:
        condition: service_healthy

  basyx-open:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    command: ["/app/aasenvironmentservice"]
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_open
      ABAC_ENABLED: "false"
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      # Optional BaSyx Go features that Studio detects per target from the
      # /description profiles: point-in-time history and the CloudEvents change
      # feed.
      BASYX_HISTORY_MODE: api
      BASYX_EVENTING_FEED_ENABLED: "true"
      # Registry sync (MVP-4): repository writes keep the AAS and submodel
      # registries filled, so the target can list shells from its registry.
      # Descriptor endpoints and feed links use the URL Studio is configured with.
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:18081
    ports:
      - "18081:5004"
    volumes:
      - ./fixtures/open:/app/preconfiguration:ro
    depends_on:
      basyx-open-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Target "secured": BaSyx Go with OIDC (Keycloak) and ABAC ---------------
  basyx-secured-schema:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_secured
    depends_on:
      postgres:
        condition: service_healthy

  basyx-secured:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    command: ["/app/aasenvironmentservice"]
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_secured
      ABAC_ENABLED: "true"
      ABAC_MODELPATH: /security/access-rules.json
      ABAC_POLICY_FILE_IMPORT: always
      OIDC_TRUSTLISTPATH: /security/trustlist.json
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      # History and the change feed, as on "open", so Studio can test them
      # with signed-in users and access rules. The registries stay unused:
      # this target lists shells from its repository.
      BASYX_HISTORY_MODE: api
      BASYX_EVENTING_FEED_ENABLED: "true"
      GENERAL_EXTERNALURL: http://localhost:18082
    ports:
      - "18082:5004"
    volumes:
      - ./basyx/secured:/security:ro
      - ./fixtures/secured:/app/preconfiguration:ro
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    depends_on:
      basyx-secured-schema:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # --- Target "large" (profile "large"): performance and lazy-tree checks ------
  # 2,000 shells and a submodel of about 5,000 elements, generated on demand:
  #   pnpm testenv:large
  # Not part of `testenv:up`, so the regular suites stay fast.
  basyx-large-db:
    image: postgres:18
    profiles: [large]
    environment:
      PGPASSWORD: postgres
    # The init script runs only when the volume is created; this adds the
    # database to an environment that already runs.
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'basyx_large'" | grep -q 1 ||
        (psql -h postgres -U postgres -c "CREATE DATABASE basyx_large OWNER basyx" &&
        psql -h postgres -U postgres -d basyx_large -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS pg_trgm;")
    depends_on:
      postgres:
        condition: service_healthy

  basyx-large-schema:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    profiles: [large]
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_large
    depends_on:
      basyx-large-db:
        condition: service_completed_successfully

  basyx-large:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    profiles: [large]
    command: ["/app/aasenvironmentservice"]
    environment:
      <<: *basyx-env
      POSTGRES_DBNAME: basyx_large
      ABAC_ENABLED: "false"
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:18083
    ports:
      - "18083:5004"
    volumes:
      - ./fixtures/large:/app/preconfiguration:ro
    depends_on:
      basyx-large-schema:
        condition: service_completed_successfully
    restart: unless-stopped
