# BaSyx Studio branding (docs/deployment/branding.md, ADR 0055).
# Paths are relative to this file. Mount the folder and point
# STUDIO_BRANDING_FILE at this file; restart Studio after changes.
version: 1

productName: Example Twin Studio
organisation: Example GmbH
supportUrl: mailto:studio-support@example.com
helpUrl: https://github.com/eclipse-basyx/basyx-studio

logo:
  light: ./logo-light.svg
  dark: ./logo-dark.svg
  compact: ./logo-mark.svg
favicon: ./logo-mark.svg

appearance:
  theme: system
  accent: { light: "#00549F", dark: "#5FA8FF" }
  secondary: { light: "#8A4B00", dark: "#F6A04D" }
  background: neutral
  shape: normal

languages:
  default: en
  available: [en, de]
  values: en

signInMessage:
  de: Willkommen im Digital-Twin-Portal der Example GmbH. Melden Sie sich mit Ihrem Firmenkonto an.
  en: Welcome to the Example GmbH digital twin portal. Sign in with your company account.

legal:
  imprint:
    de: ./legal/impressum.de.md
    en: ./legal/imprint.en.md
  privacy:
    de: ./legal/datenschutz.de.md
    en: ./legal/privacy.en.md
  accessibility: ./legal/accessibility.en.md

# Users cannot change these in Settings. Background stays available for high contrast.
locked: [accent, shape]
