name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The build also proves the server bundle: inlined aas-core and the
      # traced PGlite WebAssembly assets (ADR 0011).
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests against the test environment
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The issuer must resolve to the same address on the runner and, via
      # host-gateway, inside the BaSyx containers (see test-setup/README.md).
      - name: Resolve keycloak.localhost
        run: echo "127.0.0.1 keycloak.localhost" | sudo tee -a /etc/hosts

      - name: Start test environment
        working-directory: test-setup
        run: |
          set -euo pipefail
          docker compose up -d
          for service in postgres keycloak basyx-open basyx-secured; do
            container="$(docker compose ps -q "$service")"
            for attempt in $(seq 1 90); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$attempt" -eq 90 ]; then
                echo "$service did not become healthy (status: $status)"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Smoke test
        run: pnpm testenv:smoke

      - name: Integration tests
        run: pnpm test:integration

      - name: Dump test environment logs on failure
        if: failure()
        working-directory: test-setup
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop test environment
        if: always()
        working-directory: test-setup
        run: docker compose down -v
