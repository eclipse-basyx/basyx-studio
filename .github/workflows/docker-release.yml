name: Docker Release Image

# Every published GitHub release publishes eclipsebasyx/basyx-studio:<version>
# (the tag without a leading "v") and, unless it is a prerelease, :latest;
# signed with cosign, with provenance and SBOM attached to the release
# (ADR 0035).

on:
  release:
    types: [published]

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    name: Check repository
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        env:
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "eclipse-basyx/basyx-studio" && "${IS_FORK}" != "true" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: releases are published from eclipse-basyx/basyx-studio only (${GITHUB_REPOSITORY})."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build, sign and push the release image
    needs: guard
    if: ${{ needs.guard.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: eclipsebasyx/basyx-studio

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Install Syft
        run: |
          set -euo pipefail
          SYFT_VERSION=1.29.1
          ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${ARCHIVE}"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt.sig"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt.pem"
          cosign verify-blob \
            --certificate "syft_${SYFT_VERSION}_checksums.txt.pem" \
            --signature "syft_${SYFT_VERSION}_checksums.txt.sig" \
            --certificate-identity-regexp '^https://github\.com/anchore/syft/\.github/workflows/release\.ya?ml@refs/(heads/main|tags/v.*)$' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "syft_${SYFT_VERSION}_checksums.txt"
          grep " ${ARCHIVE}$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ARCHIVE}" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Generate version metadata
        id: meta
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="${IMAGE_NAME}:${VERSION}"
          if [[ "${PRERELEASE}" != "true" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          {
            echo "version=${VERSION}"
            echo "tags=${TAGS}"
            echo "created=${PUBLISHED_AT}"
          } >> "$GITHUB_OUTPUT"
          echo "Building release ${VERSION} as ${TAGS}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            STUDIO_VERSION=${{ steps.meta.outputs.version }}
            STUDIO_COMMIT_SHA=${{ github.sha }}
            STUDIO_BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=BaSyx Studio
            org.opencontainers.image.description=View, edit and extend Asset Administration Shells across infrastructures.
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Eclipse BaSyx
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/deployment/README.md
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Compute image reference
        id: refs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_digest_ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign image digest (keyless)
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Extract BuildKit provenance and SBOM predicates
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
        run: |
          set -euo pipefail
          mkdir -p predicates
          if ! docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --format '{{ json (index .Provenance "linux/amd64").SLSA }}' > predicates/provenance.buildkit.json 2>/dev/null; then
            docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --format '{{ json .Provenance.SLSA }}' > predicates/provenance.buildkit.json
          fi
          if ! docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > predicates/sbom.buildkit.spdx.json 2>/dev/null; then
            docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --format '{{ json .SBOM.SPDX }}' > predicates/sbom.buildkit.spdx.json
          fi
          jq -e 'type == "object" and length > 0' predicates/provenance.buildkit.json >/dev/null
          jq -e 'type == "object" and length > 0' predicates/sbom.buildkit.spdx.json >/dev/null

      - name: Detect provenance predicate type
        run: |
          set -euo pipefail
          PROVENANCE_PREDICATE_TYPE=$(jq -r '
            if has("buildDefinition") and has("runDetails") then "https://slsa.dev/provenance/v1"
            elif has("builder") and has("buildType") then "https://slsa.dev/provenance/v0.2"
            else ""
            end
          ' predicates/provenance.buildkit.json)
          if [ -z "${PROVENANCE_PREDICATE_TYPE}" ]; then
            echo "Unsupported BuildKit provenance predicate shape:" >&2
            jq -r 'keys_unsorted | @json' predicates/provenance.buildkit.json >&2
            exit 1
          fi
          echo "PROVENANCE_PREDICATE_TYPE=${PROVENANCE_PREDICATE_TYPE}" >> "$GITHUB_ENV"

      - name: Verify BuildKit attestation manifests exist
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_DIGEST_REF}" --raw > /tmp/image-index.json
          jq -e '.manifests | map(select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")) | length > 0' /tmp/image-index.json >/dev/null

      - name: Create Cosign attestations from BuildKit predicates
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --type "${PROVENANCE_PREDICATE_TYPE}" --predicate predicates/provenance.buildkit.json "${IMAGE_DIGEST_REF}"
          cosign attest --yes --type https://spdx.dev/Document --predicate predicates/sbom.buildkit.spdx.json "${IMAGE_DIGEST_REF}"

      - name: Verify signature and attestations
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-release.yml@refs/tags/${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "${COSIGN_CERT_IDENTITY}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${IMAGE_DIGEST_REF}"
          cosign verify-attestation --type "${PROVENANCE_PREDICATE_TYPE}" --certificate-identity "${COSIGN_CERT_IDENTITY}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${IMAGE_DIGEST_REF}" > /tmp/provenance.jsonl
          test -s /tmp/provenance.jsonl
          cosign verify-attestation --type https://spdx.dev/Document --certificate-identity "${COSIGN_CERT_IDENTITY}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${IMAGE_DIGEST_REF}" > /tmp/sbom-attestation.jsonl
          test -s /tmp/sbom-attestation.jsonl

      - name: Export SPDX and CycloneDX SBOM files
        env:
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          syft "${IMAGE_DIGEST_REF}" -o "spdx-json=release-assets/basyx-studio-${VERSION}.spdx.json"
          syft "${IMAGE_DIGEST_REF}" -o "cyclonedx-json=release-assets/basyx-studio-${VERSION}.cdx.json"

      - name: Write release image metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_DIGEST_REF: ${{ steps.refs.outputs.image_digest_ref }}
          SIGNATURE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-release.yml@refs/tags/${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg version "${VERSION}" \
            --arg digest "${DIGEST}" \
            --arg tags "${TAGS}" \
            --arg imageDigestRef "${IMAGE_DIGEST_REF}" \
            --arg signatureIdentity "${SIGNATURE_IDENTITY}" \
            --arg spdx "basyx-studio-${VERSION}.spdx.json" \
            --arg cyclonedx "basyx-studio-${VERSION}.cdx.json" \
            '{
              image: $image,
              version: $version,
              digest: $digest,
              tags: ($tags | split(",")),
              imageDigestRef: $imageDigestRef,
              signatureIdentity: $signatureIdentity,
              buildkitAttestations: { provenance: true, sbom: true },
              cosignAttestations: { provenance: true, sbom: true },
              sbomFiles: { spdxJson: $spdx, cyclonedxJson: $cyclonedx }
            }' > release-assets/release-image-metadata.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: release-assets/*
          retention-days: 30

      - name: Verify the pushed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra refs <<< "${TAGS}"
          for ref in "${refs[@]}"; do
            docker pull "${ref}"
          done

  attach-release-assets:
    name: Attach SBOM and metadata to the release
    needs: [guard, build-and-push]
    if: ${{ needs.guard.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: release-assets

      - name: Generate release supply-chain manifest
        run: |
          set -euo pipefail
          jq -s \
            --arg release "${GITHUB_REF_NAME}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ release: $release, generatedAt: $generatedAt, images: . }' \
            release-assets/release-image-metadata.json > release-assets/release-supply-chain-manifest.json

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*.spdx.json
            release-assets/*.cdx.json
            release-assets/release-image-metadata.json
            release-assets/release-supply-chain-manifest.json
