name: Release

# Run from the Actions tab on main with a version, e.g. 0.2.1 or 0.2.1-rc.1
# for a prerelease (ADR 0053). It commits the version of Studio and its
# packages to main, tags it v<version>, and makes a draft release. Once the
# tagged commit passes the checks, it attaches the desktop binaries, has
# docker-release.yml build the image on the tag, publishes
# @basyx/studio-sdk, @basyx/studio-app-kit and @basyx/file-viewer to npm,
# and publishes the release. Until then the release stays a draft; a re-run
# continues where the last run stopped.
#
# Publishing uses npm trusted publishing: each package's trusted publisher on
# npmjs.com names this repository and this workflow file, so no token is
# stored. Every version carries a provenance statement.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of Studio and its packages, without v: X.Y.Z, or X.Y.Z-suffix for a prerelease"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A new release commits the version to main and tags it; a re-run finds
      # the tag and continues with it.
      - name: Commit and tag the version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Run the release from ${DEFAULT_BRANCH}."
            exit 1
          fi
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --quiet --verify "refs/tags/${tag}" > /dev/null; then
            echo "Continuing the release ${tag}."
          else
            base="$(git rev-parse HEAD)"
            node scripts/release-version.mjs "${VERSION}"
            git add package.json packages/*/package.json packages/studio-sdk/README.md examples/apps/starter/package.json
            if ! git diff --cached --quiet; then
              git commit --message "Release ${VERSION}"
            fi
            git fetch --quiet origin "${DEFAULT_BRANCH}"
            if [[ "$(git rev-parse "origin/${DEFAULT_BRANCH}")" != "${base}" ]]; then
              echo "::error::${DEFAULT_BRANCH} moved on during the release; run it again."
              exit 1
            fi
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
            git tag --annotate --message "Release ${VERSION}" "${tag}"
            git push origin "refs/tags/${tag}"
          fi
          prerelease=false
          if [[ "${VERSION}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${draft}" != "true" ]]; then
              echo "::error::${TAG} is released already."
              exit 1
            fi
            exit 0
          fi
          app_api="$(git show "${TAG}:packages/studio-sdk/src/protocol.ts" | sed -n "s/.*studioAppApiVersion = '\([^']*\)'.*/\1/p")"
          notes="Studio ${VERSION}: desktop binaries below, the image \`eclipsebasyx/basyx-studio:${VERSION}\`, and \`@basyx/studio-sdk\`, \`@basyx/studio-app-kit\` and \`@basyx/file-viewer\` ${VERSION} on npm, with app API ${app_api}."
          arguments=("${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --title "${TAG}" --notes "${notes}" --generate-notes)
          if [[ "${PRERELEASE}" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"

  check:
    name: Check the release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag names the version of Studio and its packages, and the SDK's
      # README says which app API it provides.
      - name: Versions match the tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-version.mjs --check "${TAG#v}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The starter example, installed from the packed packages outside the
      # checkout: builds, packs, signs, verifies and runs on the test
      # transport.
      - name: Build an app from the packed packages
        run: node scripts/check-app-tarballs.mjs

  binaries:
    name: Build ${{ matrix.platform }} binaries
    needs: [prepare, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            build_script: build:electron:linux
            release_files: dist/*.AppImage
          - platform: macOS
            runner: macos-latest
            build_script: build:electron:mac
            release_files: dist/*.dmg dist/*.zip
          - platform: Windows
            runner: windows-latest
            build_script: build:electron:win
            release_files: dist/*.exe

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        shell: bash
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pnpm devDependency only tracks the version for Dependabot, and its
      # install script is denied (pnpm-workspace.yaml), so its bins stay sh
      # launchers that Windows cannot run. Scripts put node_modules/.bin first
      # on the PATH, so the build's nested pnpm calls would reach them instead
      # of Corepack's pnpm, which is the same version.
      - name: Use Corepack's pnpm in scripts
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f node_modules/.bin/{pnpm,pn,pnpx,pnx}{,.cmd,.ps1}

      # The version comes from package.json, which the check job compared
      # with the tag.
      - name: Build ${{ matrix.platform }} binaries
        run: pnpm ${{ matrix.build_script }}

      # gh finds draft releases by their tag, and replaces the files of an
      # earlier attempt.
      - name: Attach binaries to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          FILES: ${{ matrix.release_files }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FILES holds globs.
          gh release upload "${TAG}" ${FILES} --repo "${GITHUB_REPOSITORY}" --clobber

  # docker-release.yml runs on the tag, so the image's cosign identity is
  # docker-release.yml@refs/tags/v<version>, as docs/deployment says. A
  # workflow_dispatch is the one event that a workflow's token can start
  # another workflow with.
  image:
    name: Build the release image
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write

    steps:
      - name: Run docker-release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          runs() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-release.yml --event workflow_dispatch --branch "${TAG}" \
              --json databaseId,conclusion,createdAt --jq "$1"
          }
          if [[ -n "$(runs '[.[] | select(.conclusion == "success")][0].databaseId // empty')" ]]; then
            echo "The image of ${TAG} is built already."
            exit 0
          fi
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run docker-release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
          run=""
          for _ in $(seq 1 30); do
            run="$(runs "[.[] | select(.createdAt >= \"${since}\")][0].databaseId // empty")"
            [[ -n "${run}" ]] && break
            sleep 10
          done
          if [[ -z "${run}" ]]; then
            echo "::error::docker-release.yml did not start."
            exit 1
          fi
          echo "Waiting for ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}"
          gh run watch "${run}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 60 > /dev/null

  npm:
    name: Publish to npm
    needs: [prepare, binaries, image]
    if: ${{ github.repository == 'eclipse-basyx/basyx-studio' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing and the provenance statement.
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm --filter "./packages/*" run build

      # Recursive publishing goes in dependency order and skips versions that
      # are on npm already, so a re-run after a partial failure completes the
      # release. The tag checkout is a detached HEAD, hence no git checks. A
      # prerelease goes to the dist-tag next, so latest stays on the last
      # release.
      - name: Publish
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=latest
          if [[ "${PRERELEASE}" == "true" ]]; then
            tag=next
          fi
          pnpm publish --recursive --filter "./packages/*" --access public --provenance --no-git-checks --tag "${tag}"

  publish:
    name: Publish the release
    needs: [prepare, binaries, image, npm]
    # npm is skipped outside eclipse-basyx/basyx-studio.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && needs.image.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.npm.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          latest=true
          if [[ "${PRERELEASE}" == "true" ]]; then
            latest=false
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${latest}"
          echo "Released ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
