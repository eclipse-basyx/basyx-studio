name: Release App Binaries

on:
  release:
    types: [published]

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            build_script: build:electron:linux
            release_files: |
              dist/*.AppImage
          - platform: macOS
            runner: macos-latest
            build_script: build:electron:mac
            release_files: |
              dist/*.dmg
              dist/*.zip
          - platform: Windows
            runner: windows-latest
            build_script: build:electron:win
            release_files: |
              dist/*.exe

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        id: pnpm
        shell: bash
        run: bash .github/scripts/setup-pnpm.sh

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set application version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build ${{ matrix.platform }} binaries
        run: pnpm ${{ matrix.build_script }}

      - name: Attach binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ matrix.release_files }}
          fail_on_unmatched_files: true
