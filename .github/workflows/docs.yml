name: Documentation

# Markdown style and links. The CI workflow skips changes that only touch
# documentation (docs/development/ci.md), so this workflow checks them.

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".markdown-link-check.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".markdown-link-check.json"
      - ".github/workflows/docs.yml"
  # Links break without a change here; check them once a week.
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Markdown style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Markdown style
        run: pnpm lint:md

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Markdown links
        run: pnpm lint:links
