name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >-
        Describe what you are trying to do and what makes it hard today, e.g.
        "When I compare two submodels, I have to ...".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like Studio to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other solutions or workarounds you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Browsing and editing live AAS data
        - AASX packages on the desktop
        - Apps and the Studio SDK
        - App Builder
        - Deployment and configuration
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sketches, AAS files or links to specifications.
