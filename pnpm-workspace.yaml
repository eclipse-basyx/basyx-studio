packages:
  - "."
  # The Studio SDK for app authors and the example apps (MVP-3).
  - "packages/*"
  - "examples/apps/*"
  # An app in a repository of its own, built from the packed packages
  # (ADR 0043, scripts/check-app-tarballs.mjs).
  - "!examples/apps/starter"
  # Apps shipped with Studio (ADR 0023).
  - "apps/*"

storeDir: ../.pnpm-store
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Reviewed Eclipse BaSyx and Eclipse AAS Core Works releases that may be
# installed before the 24-hour delay ends, by exact version only (ADR 0012,
# ADR 0031). Entries may be removed once the version is older than 24 hours.
minimumReleaseAgeExclude:
  - basyx-typescript-sdk@2.4.2
  - aas-package3-typescript@1.1.0
strictDepBuilds: true
blockExoticSubdeps: true
trustLockfile: false

# Reviewed native/build steps required by the Nuxt toolchain. Exact versions are
# pinned in pnpm-lock.yaml: @parcel/watcher 2.6.0; esbuild 0.25.12, 0.27.7, and
# 0.28.2; unrs-resolver 1.12.2.
allowBuilds:
  "@parcel/watcher": true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
  # Reviewed and denied: its install script only replaces the JS launcher with
  # the platform binary. Studio runs the binary of the matching @deno/* package
  # directly (server/lib/apps/runner).
  deno: false
  # Reviewed and denied: its install script only swaps the JS launcher for a
  # native binary. The devDependency exists for Dependabot version tracking;
  # the pnpm binary in use comes from Corepack (packageManager field).
  pnpm: false
  # Reviewed and denied: a dependency of Vue Flow (BOM viewer app). Its
  # install script only switches its shim between Vue 2 and 3; the published
  # files already target Vue 3.
  vue-demi: false
patchedDependencies:
  vuetify@4.2.6: patches/vuetify@4.2.6.patch
