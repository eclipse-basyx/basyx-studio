        default: { $ref: '#/components/responses/Problem' }

  /copy-plans:
    post:
      tags: [Copies]
      operationId: createCopyPlan
      summary: Plan a copy of shells, submodels or concept descriptions into a target
      description: |
        The source is resources of a target (read now and again on execution)
        or AAS JSON or XML text: an environment, a shell, a submodel or a
        concept description. The plan lists the chosen resources, a shell's
        submodels, the concept descriptions the source has for their semantic
        IDs and their files, each with its state at the destination and its
        AAS Core findings. Planning writes nothing. Plans are kept in memory
        for 30 minutes and belong to the user who made them.
      x-requirements: [PROD-007, DATA-011, DATA-012, DATA-013, DATA-016]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyPlanRequest' }
      responses:
        '201':
          description: Expiring copy plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyPlan' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /copy-plans/uploads:
    post:
      tags: [Copies]
      operationId: createImportPlan
      summary: Plan the import of an AASX, JSON or XML file into a target as a copy
      description: |
        The file is the request body; the Workspace Worker reads it with the
        package's supplementary files and thumbnail. Packages import through
        this route, as they have no BaSyx upload.
      x-requirements: [DATA-006, DATA-012, DATA-013]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: destinationTargetId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TargetId' }
        - name: fileName
          in: query
          required: true
          schema: { type: string, maxLength: 255 }
        - name: destinationShellKey
          in: query
          required: false
          description: The file's submodels are also referenced from this shell (the shell page's import).
          schema: { $ref: '#/components/schemas/ResourceKey' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Expiring copy plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyPlan' }
        default: { $ref: '#/components/responses/Problem' }

  /copy-plans/{copyPlanId}:
    get:
      tags: [Copies]
      operationId: getCopyPlan
      summary: Get a copy plan of the signed-in user until it expires
      x-requirements: [DATA-012, DATA-013]
      parameters:
        - $ref: '#/components/parameters/CopyPlanId'
      responses:
        '200':
          description: Copy plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyPlan' }
        default: { $ref: '#/components/responses/Problem' }

  /copy-plans/{copyPlanId}/executions:
    post:
      tags: [Copies]
      operationId: executeCopyPlan
      summary: Run a copy plan with the confirmed collision policy and get its report
      description: |
        Source and destination are opened again, so their rights are checked
        now. Concept descriptions are written first, then submodels with their
        files, then shells with their thumbnails, then registry entries where
        Studio keeps them in step. Independent targets form no transaction:
        each resource reports its own outcome and the source stays unchanged.
        Each resource is read again first and compared with the plan; when
        one changed, nothing is written and the answer is `revision_conflict`.
        The `Idempotency-Key` is required. A repeated key answers with the
        first report, also while that execution still runs; executions of one
        plan run one after another. Running the plan again skips the resources
        an earlier run completed, keeps the identifiers it gave, and completes
        the steps it left open.
      x-requirements: [PROD-007, DATA-012, DATA-013, DATA-014, DATA-015, DATA-020]
      parameters:
        - $ref: '#/components/parameters/CopyPlanId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyExecutionRequest' }
      responses:
        '200':
          description: Report of the copy, also on partial success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyReport' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

