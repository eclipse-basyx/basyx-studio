    BindingResolution:
      type: object
      additionalProperties: false
      required: [status, candidates, diagnostics]
      properties:
        status: { $ref: '#/components/schemas/BindingResolutionStatus' }
        resolvedResource: { $ref: '#/components/schemas/AasResourceSummary' }
        candidates:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/AasResourceSummary' }
        diagnostics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Diagnostic' }
    WidgetBindingResolution:
      type: object
      additionalProperties: false
      required: [widgetId, bindingSlot, resolution]
      properties:
        widgetId: { type: string, maxLength: 200 }
        bindingSlot: { type: string, maxLength: 100 }
        resolution: { $ref: '#/components/schemas/BindingResolution' }
    WidgetGrant:
      type: object
      additionalProperties: false
      required: [widgetId, widgetType, available, permissions]
      properties:
        widgetId: { type: string, maxLength: 200 }
        widgetType: { type: string, maxLength: 300 }
        available: { type: boolean }
        sandboxed: { type: boolean }
        appInstallationId: { $ref: '#/components/schemas/InstallationId' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }
    ViewRuntimeContext:
      type: object
      additionalProperties: false
      required: [view, context, widgetGrants, bindingResolutions]
      properties:
        view: { $ref: '#/components/schemas/View' }
        context: { $ref: '#/components/schemas/ViewContext' }
        widgetGrants:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/WidgetGrant' }
        bindingResolutions:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/WidgetBindingResolution' }
    BindingAction:
      type: string
      enum: [read, write, invoke]
    BindingExecutionRequest:
      type: object
      additionalProperties: false
      required: [viewId, viewRevision, widgetId, bindingSlot, action, context]
      properties:
        viewId: { $ref: '#/components/schemas/ViewId' }
        viewRevision: { $ref: '#/components/schemas/Revision' }
        widgetId: { type: string, maxLength: 200 }
        bindingSlot: { type: string, maxLength: 100 }
        action: { $ref: '#/components/schemas/BindingAction' }
        context: { $ref: '#/components/schemas/ViewContext' }
        expectedTargetRevision: { $ref: '#/components/schemas/Revision' }
        value:
          description: Present only for a write action and validated against the resolved AAS value type.
        inputs:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AasModelPayload' }
        confirmed: { type: boolean, default: false }
    BindingExecutionResult:
      type: object
      additionalProperties: false
      required: [action, targetRevision, diagnostics]
      properties:
        action: { $ref: '#/components/schemas/BindingAction' }
        value: {}
        targetRevision: { $ref: '#/components/schemas/Revision' }
        diagnostics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Diagnostic' }
    BindingSlotDescriptor:
      type: object
      additionalProperties: false
      required: [name, directions, cardinality]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        directions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/BindingDirection' }
        cardinality: { $ref: '#/components/schemas/BindingCardinality' }
        valueType: { type: string, maxLength: 200 }
        semanticRequirements:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 4096 }
    LayoutConstraints:
      type: object
      additionalProperties: false
      properties:
        minWidth: { type: integer, minimum: 1, maximum: 256 }
        minHeight: { type: integer, minimum: 1, maximum: 10000 }
        preferredWidth: { type: integer, minimum: 1, maximum: 256 }
        preferredHeight: { type: integer, minimum: 1, maximum: 10000 }
        responsive: { type: boolean }
    WidgetTypeDescriptor:
      type: object
      additionalProperties: false
      required: [type, displayName, source, configurationSchema, bindingSlots, layout, compatibility, applicability, permissions]
      properties:
        type: { type: string, minLength: 3, maxLength: 300 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [built_in, app] }
        publisher: { type: string, maxLength: 500 }
        appId: { $ref: '#/components/schemas/AppId' }
        installationId: { $ref: '#/components/schemas/InstallationId' }
        configurationSchema:
          type: object
          description: JSON Schema 2020-12 document validated and size-bounded by Studio.
          unevaluatedProperties: true
        bindingSlots:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BindingSlotDescriptor' }
        layout: { $ref: '#/components/schemas/LayoutConstraints' }
        compatibility: { $ref: '#/components/schemas/CompatibilityResult' }
        applicability: { $ref: '#/components/schemas/ApplicabilityResult' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
        sandboxed: { type: boolean }
    WidgetTypePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WidgetTypeDescriptor' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CompatibilityStatus:
      type: string
      enum: [compatible, incompatible, unknown]
    ApplicabilityStatus:
      type: string
      enum: [applicable, partially_applicable, not_applicable, unknown]
    CompatibilityResult:
      type: object
      additionalProperties: false
      required: [status, reasons]
      properties:
        status: { $ref: '#/components/schemas/CompatibilityStatus' }
        reasons:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 1000 }
        supportedStudioRange: { type: string, maxLength: 200 }
        supportedApiRange: { type: string, maxLength: 200 }
        supportedMetamodelVersions:
          type: array
          items: { type: string, maxLength: 100 }
    ApplicabilityResult:
      type: object
      additionalProperties: false
      required: [status, reasons]
      properties:
        status: { $ref: '#/components/schemas/ApplicabilityStatus' }
        reasons:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 1000 }
        matchedSemanticIds:
          type: array
          maxItems: 1000
          items: { type: string, maxLength: 4096 }
        missingSemanticIds:
          type: array
          maxItems: 1000
          items: { type: string, maxLength: 4096 }
    AppRuntimeCategory:
      type: string
      enum: [ui_only, standard_backend, privileged_native]
    AppDeploymentTarget:
      type: string
      enum: [hosted, desktop]
    AppCapabilityName:
      type: string
      enum:
        - studio.aas.read
        - studio.aas.write
        - studio.aas.invoke
        - studio.files.pick
        - studio.files.read
        - studio.files.write
        - studio.http.request
        - studio.ui.notifications
        - studio.ui.navigation
        - studio.ui.clipboard
        - studio.ui.externalFiles
        - studio.ui.saveFiles
        - studio.ui.commands
        - studio.ui.panels
        - studio.semantic.read
        - studio.jobs.start
        - studio.jobs.observe
        - studio.views.widget
        - studio.views.binding.read
        - studio.views.binding.write
        - studio.views.binding.invoke
        - studio.backend
        - studio.containers
        - studio.timeseries.read
        - studio.connections
    AppCapabilityRequest:
      type: object
      additionalProperties: false
      required: [name, required]
      properties:
        name: { $ref: '#/components/schemas/AppCapabilityName' }
        required: { type: boolean }
        rationale: { type: string, maxLength: 2000 }
        networkOrigins:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uri
            maxLength: 4096
            pattern: '^https?://[^/?#]+$'
            description: Declarative origin only; requests still pass redirect, DNS, address, timeout, and byte-limit enforcement.
    AppCapabilityApproval:
      type: object
      additionalProperties: false
      required: [name, approved]
      properties:
        name: { $ref: '#/components/schemas/AppCapabilityName' }
        approved: { type: boolean }
        limits:
          type: object
          maxProperties: 50
          additionalProperties:
            oneOf:
              - { type: integer }
              - { type: string, maxLength: 500 }
              - { type: boolean }
    AppProvenance:
      type: object
      additionalProperties: false
      required: [digest, signatureStatus, revocationStatus]
      properties:
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        signatureStatus: { type: string, enum: [verified, invalid, unverified] }
        revocationStatus: { type: string, enum: [active, revoked, unknown] }
        publisherVerified: { type: boolean }
        reviewStatus: { type: string, enum: [reviewed, automated_checks_only, unreviewed] }
        sbomReference: { type: string, format: uri, maxLength: 4096 }
        provenanceReference: { type: string, format: uri, maxLength: 4096 }
        vulnerabilitySummary:
          type: object
          additionalProperties: false
          properties:
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
            low: { type: integer, minimum: 0 }
            scannedAt: { $ref: '#/components/schemas/Timestamp' }
    AppVersion:
      type: object
      additionalProperties: false
      required: [appId, publisher, version, displayName, runtimeCategory, deploymentTargets, provenance, requestedCapabilities, compatibility, applicability, widgetTypes]
      properties:
        appId: { $ref: '#/components/schemas/AppId' }
        publisher: { type: string, minLength: 1, maxLength: 500 }
        version: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        runtimeCategory: { $ref: '#/components/schemas/AppRuntimeCategory' }
        deploymentTargets:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/AppDeploymentTarget' }
        provenance: { $ref: '#/components/schemas/AppProvenance' }
        requestedCapabilities:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppCapabilityRequest' }
        dataEgressWarning:
          type: boolean
          description: True when requested AAS-read and network capabilities could transmit AAS data externally.
        compatibility: { $ref: '#/components/schemas/CompatibilityResult' }
        applicability: { $ref: '#/components/schemas/ApplicabilityResult' }
        widgetTypes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/WidgetTypeDescriptor' }
    AppCatalogEntry:
      type: object
      additionalProperties: false
      required: [appId, displayName, publisher, latestVersion, compatibility, applicability]
      properties:
        appId: { $ref: '#/components/schemas/AppId' }
        displayName: { type: string, maxLength: 200 }
        publisher: { type: string, maxLength: 500 }
        summary: { type: string, maxLength: 2000 }
        latestVersion: { type: string, maxLength: 100 }
        compatibility: { $ref: '#/components/schemas/CompatibilityResult' }
        applicability: { $ref: '#/components/schemas/ApplicabilityResult' }
        installed: { type: boolean }
        reviewStatus: { type: string, enum: [reviewed, automated_checks_only, unreviewed] }
    AppCatalogPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppCatalogEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AppInstallRequest:
      type: object
      additionalProperties: false
      required: [appId, version, digest, approvedCapabilities, confirmedWarnings]
      properties:
        appId: { $ref: '#/components/schemas/AppId' }
        version: { type: string, maxLength: 100 }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        approvedCapabilities:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppCapabilityApproval' }
        confirmedWarnings:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [data_egress, privileged_full_trust, native_access]
        visibility: { $ref: '#/components/schemas/AccessRuleSet' }
    AppInstallScope:
      type: string
      enum: [deployment, local_machine_user]
    AppInstallationStatus:
      type: string
      enum: [installing, installed, activating, active, inactive, failed, disabled, revoked, removing]
    AppEvaluation:
      type: object
      additionalProperties: false
      required: [compatibility, applicability, permissions]
      properties:
        compatibility: { $ref: '#/components/schemas/CompatibilityResult' }
        applicability: { $ref: '#/components/schemas/ApplicabilityResult' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
        activatable: { type: boolean }
    AppInstallation:
      type: object
      additionalProperties: false
      required: [id, app, scope, status, approvedCapabilities, visibility, revision, installedAt]
      properties:
        id: { $ref: '#/components/schemas/InstallationId' }
        app: { $ref: '#/components/schemas/AppVersion' }
        scope: { $ref: '#/components/schemas/AppInstallScope' }
        status: { $ref: '#/components/schemas/AppInstallationStatus' }
        approvedCapabilities:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppCapabilityApproval' }
        visibility: { $ref: '#/components/schemas/AccessRuleSet' }
        evaluation: { $ref: '#/components/schemas/AppEvaluation' }
        activeTargetIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/TargetId' }
        rollbackVersion: { type: string, maxLength: 100 }
        revision: { $ref: '#/components/schemas/Revision' }
        installedAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    LocalizedText:
      type: object
      additionalProperties: { type: string, maxLength: 1000 }
    AppDeveloperInstallation:
      description: An installation from a developer-mode package (MVP-3).
      type: object
      additionalProperties: false
      required: [id, appId, version, title, description, publisher, digest, unsigned, bundled, permissions, submodelViews, modules, backend, installedAt, installedBy]
      properties:
        id: { type: string, pattern: '^app-[0-9a-f]{16}$' }
        appId: { $ref: '#/components/schemas/AppId' }
        version: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description:
          oneOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        publisher: { type: string, maxLength: 128 }
        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        unsigned: { type: boolean }
        bundled:
          type: boolean
          description: Shipped with Studio and installed at startup; cannot be uninstalled (ADR 0023).
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AppCapabilityName' }
        submodelViews: { type: integer, minimum: 0 }
        modules: { type: integer, minimum: 0 }
        backend: { type: boolean }
        installedAt: { type: string, format: date-time }
        installedBy: { type: string }
    AppContributionBase:
      type: object
      required: [installationId, appId, appTitle, id, title, entryUrl, permissions, unsigned, bundled, frameOrigin]
      properties:
        installationId: { type: string }
        appId: { $ref: '#/components/schemas/AppId' }
        appTitle: { $ref: '#/components/schemas/LocalizedText' }
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        entryUrl:
          type: string
          description: Entry document on the apps origin, or `studio-app://…` on desktop (ADR 0017).
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AppCapabilityName' }
        unsigned: { type: boolean }
        bundled: { type: boolean }
        frameOrigin:
          type: [string, 'null']
          description: The installation's own origin, which its frames keep (`allow-same-origin`); `null` when all apps share one apps origin and frames stay opaque (ADR 0045).
    AppContributions:
      type: object
      additionalProperties: false
      required: [submodelViews, modules]
      properties:
        submodelViews:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/AppContributionBase' }
              - type: object
                required: [kind, reason, columns]
                properties:
                  kind: { const: submodelView }
                  reason:
                    type: object
                    required: [semanticId]
                    properties:
                      semanticId: { type: string }
                  columns:
                    type: object
                    description: Default widths on a shell's Overview, in columns of 12, per Vuetify breakpoint of the Overview's width (manifest `columns`; ADR 0032).
                    additionalProperties: false
                    properties:
                      xs: { type: integer, minimum: 3, maximum: 12 }
                      sm: { type: integer, minimum: 3, maximum: 12 }
                      md: { type: integer, minimum: 3, maximum: 12 }
                      lg: { type: integer, minimum: 3, maximum: 12 }
                      xl: { type: integer, minimum: 3, maximum: 12 }
                      xxl: { type: integer, minimum: 3, maximum: 12 }
        modules:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/AppContributionBase' }
              - type: object
                required: [kind, icon, route, context, layout]
                properties:
                  kind: { const: module }
                  icon: { type: [string, 'null'] }
                  route: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
                  context: { enum: [global, target, shell] }
                  layout:
                    enum: [standard, fullPage]
                    description: '`fullPage`: the frame fills the page, without header, card or padding (ADR 0045).'
    AppCallRequest:
      type: object
      additionalProperties: false
      required: [method, params]
      properties:
        installationId:
          type: string
          description: Required for host calls; implied by the capability token for backend calls.
        targetId:
          oneOf:
            - { $ref: '#/components/schemas/TargetId' }
            - { type: 'null' }
        shellId:
          type: [string, 'null']
          maxLength: 4000
          description: The shell the frame shows, if any; some infrastructures reach submodels only through it (template `identifiable`, MVP-4).
        mode:
          enum: [view, edit]
          description: Studio's mode on the page that hosts the frame; structural writes need `edit` (ADR 0049). Ignored for backend calls, whose token carries the mode.
        method:
          enum:
            - studio.ui.getContext
            - studio.ui.notify
            - studio.ui.navigate
            - studio.ui.setHeight
            - studio.ui.openFile
            - studio.aas.listShells
            - studio.aas.getShell
            - studio.aas.listSubmodels
            - studio.aas.getSubmodel
            - studio.aas.getElement
            - studio.aas.describeConcepts
            - studio.aas.setElementValue
            - studio.aas.getSubmodelSnapshot
            - studio.aas.createShell
            - studio.aas.createSubmodel
            - studio.aas.putSubmodel
            - studio.aas.addElement
            - studio.aas.putElement
            - studio.aas.deleteElement
            - studio.aas.deleteSubmodel
            - studio.aas.deleteShell
            - studio.backend.call
            - studio.ui.openFullscreen
            - studio.ui.closeFullscreen
            - studio.ui.setViewState
            - studio.ui.readExternalFile
            - studio.ui.previewFile
            - studio.ui.openTarget
            - studio.ui.openShell
            - studio.ui.openView
            - studio.ui.embedView
            - studio.ui.openExternal
            - studio.ui.copyText
            - studio.ui.saveFile
            - studio.containers.listEngines
            - studio.containers.selectEngine
            - studio.containers.listStacks
            - studio.containers.getStack
            - studio.containers.planStack
            - studio.containers.createStack
            - studio.containers.changeStack
            - studio.containers.startStack
            - studio.containers.stopStack
            - studio.containers.updateStack
            - studio.containers.removeStack
            - studio.containers.getJob
            - studio.containers.getLogs
            - studio.containers.saveLogs
            - studio.containers.getSignIn
            - studio.containers.pickFiles
            - studio.containers.exportStack
            - studio.containers.importStack
            - studio.timeseries.read
            - studio.connections.call
        params:
          description: Method parameters as defined by `@basyx/studio-sdk` (`studio-sdk/0`); for studio.connections.call, `ConnectionCallParams`. The context returned by `studio.ui.getContext` includes Studio's `mode` (`view` or `edit`); apps show edit controls only in `edit` (MVP-4, UX-006).
    AppCallResult:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          description: The method's result; for studio.connections.call, `ConnectionCallResult`.
    ConnectionCallParams:
      description: |
        Parameters of studio.connections.call in this binding (ADR 0047).
        `body` is what the chosen request media type takes: a JSON value for
        JSON, a string for text, `{ fields }` for
        `application/x-www-form-urlencoded`, `{ fields, files }` for
        `multipart/form-data`, and base64 with `encoding: base64` for any
        other media type. Up to 8 MiB.
      type: object
      additionalProperties: false
      required: [connection, operation]
      properties:
        connection: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: The `id` of a connection in the app's manifest. }
        operation: { type: string, maxLength: 200, description: An `operationId` the manifest lists for the connection. }
        path:
          type: object
          description: Values of the path template's parameters, arrays for array parameters (comma-separated); each fills one segment, `.` and `..` are refused.
          additionalProperties: { $ref: '#/components/schemas/ConnectionParameterValues' }
        query:
          type: object
          description: Values of declared query parameters; arrays for array parameters, repeated or comma-separated as the operation says.
          additionalProperties: { $ref: '#/components/schemas/ConnectionParameterValues' }
        headers:
          type: object
          description: Values of declared header parameters, e.g. `If-Match`; arrays for array parameters (comma-separated).
          additionalProperties: { $ref: '#/components/schemas/ConnectionParameterValues' }
        contentType: { type: string, maxLength: 200, description: One of the request media types the operation declares; default its first. }
        body: {}
        encoding: { const: base64, description: '`body` is a base64 string of bytes.' }
    ConnectionParameterValues:
      oneOf:
        - { type: [string, number, boolean] }
        - { type: array, maxItems: 1000, items: { type: [string, number, boolean] } }
    ConnectionCallResult:
      description: The service's answer; every status is a result. Redirects (`3xx` other than `304`) are refused as `connection_request_refused`.
      type: object
      additionalProperties: false
      required: [status, contentType, etag, location, body]
      properties:
        status: { type: integer }
        contentType: { type: [string, 'null'] }
        etag: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        body:
          description: A JSON value for JSON media types, a string for text, base64 with `encoding` for other media types, `null` when empty.
        encoding: { const: base64 }
    AppInstallationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppInstallation' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AppActivationRequest:
      type: object
      additionalProperties: false
      required: [targetId]
      properties:
        targetId: { $ref: '#/components/schemas/TargetId' }
        contextResourceKey: { $ref: '#/components/schemas/ResourceKey' }
    AppUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, digest, approvedCapabilities, confirmedWarnings]
      properties:
        version: { type: string, maxLength: 100 }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        approvedCapabilities:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AppCapabilityApproval' }
        confirmedWarnings:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [data_egress, privileged_full_trust, native_access, capability_increase]
    AppRollbackRequest:
      type: object
      additionalProperties: false
      required: [version, confirmed]
      properties:
        version: { type: string, maxLength: 100 }
        confirmed: { type: boolean, const: true }
    OperationKind:
      type: string
      enum: [aas_operation, cross_target_copy, cross_target_copy_retry, app_install, app_update, app_rollback, app_remove, app_activate]
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, partial_success, failed]
    OperationProgress:
      type: object
      additionalProperties: false
      required: [completedUnits]
      properties:
        phase: { type: string, maxLength: 100 }
        completedUnits: { type: integer, minimum: 0 }
        totalUnits: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        message: { type: string, maxLength: 1000 }
    OperationLinks:
      type: object
      additionalProperties: false
      properties:
        self: { type: string, format: uri-reference }
        events: { type: string, format: uri-reference }
        report: { type: string, format: uri-reference }
        retry: { type: string, format: uri-reference }
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, progress, retryable, createdAt, requestId, correlationId, links]
      properties:
        id: { $ref: '#/components/schemas/OperationId' }
        kind: { $ref: '#/components/schemas/OperationKind' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        progress: { $ref: '#/components/schemas/OperationProgress' }
        retryable: { type: boolean }
        targetIds:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/TargetId' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        completedAt: { $ref: '#/components/schemas/Timestamp' }
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        requestId: { type: string, maxLength: 200 }
        correlationId: { type: string, maxLength: 200 }
        links: { $ref: '#/components/schemas/OperationLinks' }
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: { $ref: '#/components/schemas/Operation' }
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        page: { $ref: '#/components/schemas/PageInfo' }
    OperationEventType:
      type: string
      enum: [progress, resource_outcome, completed, failed, heartbeat]
    OperationEvent:
      type: object
      additionalProperties: false
      required: [id, type, operationId, occurredAt, data]
      properties:
        id: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/OperationEventType' }
        operationId: { $ref: '#/components/schemas/OperationId' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        data:
          oneOf:
            - $ref: '#/components/schemas/OperationProgress'
            - $ref: '#/components/schemas/CopyResourceOutcome'
            - $ref: '#/components/schemas/Operation'
            - type: object
              maxProperties: 0
    StudioEventType:
      type: string
      enum: [target_changed, aas_invalidated, view_invalidated, app_changed, notification, heartbeat]
    StudioEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, data]
      properties:
        id: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/StudioEventType' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        targetId: { $ref: '#/components/schemas/TargetId' }
        resourceKeys:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ResourceKey' }
        data:
          type: object
          maxProperties: 100
          unevaluatedProperties: true
    DiagnosticSeverity:
      type: string
      enum: [info, warning, error]
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, message]
      properties:
        severity: { $ref: '#/components/schemas/DiagnosticSeverity' }
        code: { type: string, minLength: 1, maxLength: 100 }
        message: { type: string, minLength: 1, maxLength: 2000 }
        jsonPointer: { type: string, maxLength: 2000 }
        resourceKey: { $ref: '#/components/schemas/ResourceKey' }
        remediation: { type: string, maxLength: 2000 }
    AasValidationKind:
      type: string
      enum: [element, submodel, shell, conceptDescription]
    AasValidationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { $ref: '#/components/schemas/AasValidationKind' }
            value: {}
        - type: object
          additionalProperties: false
          required: [kind, format, text]
          properties:
            kind: { $ref: '#/components/schemas/AasValidationKind' }
            format: { type: string, enum: [json, xml] }
            text: { type: string, maxLength: 20000000 }
    AasValidationResult:
      type: object
      additionalProperties: false
      required: [violations]
      properties:
        violations:
          type: array
          items: { $ref: '#/components/schemas/ProblemViolation' }
        value:
          description: For the text of an element, the element as JSON.
          oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }]
        contents:
          description: For the text of shells, submodels or concept descriptions, how many of each it holds.
          oneOf:
            - type: object
              additionalProperties: false
              required: [shells, submodels, conceptDescriptions]
              properties:
                shells: { type: integer, minimum: 0 }
                submodels: { type: integer, minimum: 0 }
                conceptDescriptions: { type: integer, minimum: 0 }
            - type: 'null'
    ValidationResult:
      type: object
      additionalProperties: false
      required: [valid, diagnostics]
      properties:
        valid: { type: boolean }
        diagnostics:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/Diagnostic' }
    ProblemViolation:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          maxLength: 2000
          description: Location of the finding, for example a field path or a JSON pointer into a query.
        message: { type: string, maxLength: 2000 }
    ProblemCode:
      type: string
      description: |
        Stable problem code; the UI branches on these codes, never on HTTP status
        codes or message texts. HTTP status per code: `unauthenticated` 401;
        `forbidden`, `csrf_rejected`, `target_forbidden`, `app_unsigned_disabled`,
        `app_permission_not_declared`, `app_edit_mode_required` 403; `invalid_request`,
        `target_request_rejected` 400; `not_found`, `target_resource_not_found`,
        `app_not_found` 404; `target_auth_required`, `workspace_unsaved_changes`,
        `app_already_installed`, `idshort_conflict`, `identifier_conflict` 409; `revision_conflict`,
        `structure_conflict` 412; `partial_write` 502; `template_invalid` 422;
        `precondition_required` 428; `unsupported_operation`,
        `validation_failed`, `endpoint_rejected`, `infrastructure_unreachable`,
        `query_invalid`, `query_unsupported`, `package_rejected`,
        `app_package_rejected`, `app_incompatible`,
        `client_certificate_invalid` 422; `internal_error` 500;
        `target_credentials_rejected`, `target_unreachable`, `target_blocked`,
        `descriptor_endpoint_blocked`, `target_error`,
        `target_invalid_response`, `target_client_certificate_required`,
        `target_client_certificate_rejected`, `app_backend_failed` 502;
        `app_backend_unavailable` 503.

        Connections (ADR 0040) added `connection_not_configured` and
        `connection_request_refused` 422 (no connection of the infrastructure
        serves the service the content names; the content asks for something
        the adapter does not send), `connection_credentials_unavailable`,
        `connection_rejected`, `connection_unavailable` and `connection_error`
        502, and `timeseries_invalid` 422 (not a Time Series Data submodel, or
        its segment or records are missing).

        HTTP connections for apps (ADR 0047) added `connection_not_bound` and
        `connection_operation_not_declared` 403 (no `http` connection of the
        infrastructure binds the app's connection; the manifest does not
        declare the connection or operation) and `connection_busy` 429 (four
        calls of this session to the connection are in progress).

        MVP-4 added `descriptor_endpoint_blocked` (a registry descriptor points
        to an endpoint outside the infrastructure, which Studio never contacts),
        `query_invalid` (a raw query failed its checks; findings in
        `violations`) and `query_unsupported` (the target cannot run queries or
        element searches).

        Client certificates (ADR 0025) added
        `target_client_certificate_required` (the target or its IdP requires a
        TLS client certificate that Studio did not present or the target did
        not accept), `target_client_certificate_rejected` (a TLS alert rejected
        the certificate, e.g. unknown CA, expired or revoked) and
        `client_certificate_invalid` (the stored certificate cannot be used,
        e.g. an unreadable file, wrong passphrase or expiry).
      enum:
        - unauthenticated
        - forbidden
        - csrf_rejected
        - invalid_request
        - not_found
        - revision_conflict
        - idshort_conflict
        - structure_conflict
        - identifier_conflict
        - partial_write
        - template_invalid
        - precondition_required
        - unsupported_operation
        - validation_failed
        - internal_error
        - endpoint_rejected
        - infrastructure_unreachable
        - target_auth_required
        - target_credentials_rejected
        - target_forbidden
        - target_resource_not_found
        - target_request_rejected
        - target_unreachable
        - target_blocked
        - descriptor_endpoint_blocked
        - query_invalid
        - query_unsupported
        - target_error
        - target_invalid_response
        - target_client_certificate_required
        - target_client_certificate_rejected
        - client_certificate_invalid
        - workspace_unsaved_changes
        - package_rejected
        - app_package_rejected
        - app_incompatible
        - app_already_installed
        - app_unsigned_disabled
        - app_not_found
        - app_permission_not_declared
        - app_edit_mode_required
        - app_backend_unavailable
        - app_backend_failed
        - external_file_unavailable
        - external_file_refused
        - connection_not_configured
        - connection_credentials_unavailable
        - connection_rejected
        - connection_unavailable
        - connection_error
        - connection_request_refused
        - connection_not_bound
        - connection_operation_not_declared
        - connection_busy
        - timeseries_invalid
    Problem:
      type: object
      additionalProperties: false
      description: The implemented routes return `type` (`about:blank`), `title`, `status`, `code`, `detail`, `requestId`, `retryable`, and `violations`; the other fields are part of the draft.
      required: [type, title, status, code, requestId, retryable]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 4000 }
        instance: { type: string, format: uri-reference }
        code: { $ref: '#/components/schemas/ProblemCode' }
        requestId: { type: string, maxLength: 200 }
        correlationId: { type: string, maxLength: 200 }
        retryable: { type: boolean }
        targetId: { $ref: '#/components/schemas/TargetId' }
        authenticationRequiredTargetIds:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/TargetId' }
        currentRevision: { $ref: '#/components/schemas/Revision' }
        violations:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ProblemViolation' }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actor, action, outcome, requestId, correlationId]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        actor:
          type: object
          additionalProperties: false
          required: [userId]
          properties:
            userId: { type: string, maxLength: 500 }
            downstreamIdentity: { type: string, maxLength: 500 }
            appId: { $ref: '#/components/schemas/AppId' }
            appVersion: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        outcome: { type: string, enum: [allowed, denied, succeeded, failed, partial_success] }
        targetIds:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/TargetId' }
        operationId: { $ref: '#/components/schemas/OperationId' }
        collisionPolicy: { $ref: '#/components/schemas/CollisionPolicy' }
        resourceOutcomeCounts: { $ref: '#/components/schemas/CopyReportCounts' }
        requestId: { type: string, maxLength: 200 }
        correlationId: { type: string, maxLength: 200 }
        errorCode: { type: string, maxLength: 100 }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        page: { $ref: '#/components/schemas/PageInfo' }
