      responses:
        '200':
          description: App installation
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInstallation' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Apps, Operations]
      operationId: removeAppInstallation
      summary: Remove an installation without executing app code in the Studio Service
      description: Apps shipped with Studio (`bundled`, ADR 0023) cannot be removed and are refused with `forbidden`.
      x-requirements: [APP-004, APP-005, APP-010, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Removal operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/settings:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    put:
      tags: [Apps]
      operationId: putAppInstallationSettings
      summary: Replace the installation's values of the app's declared settings
      description: Every key must be a setting of the installed manifest that accepts its value; others are refused with `invalid_request` and a violation per key (`values.pageSize`). Audited as `app.settings.update` with the changed keys, never the values (ADR 0048). Administrators only.
      x-requirements: [APP-025]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppSettingsUpdate' }
      responses:
        '200':
          description: The installation with its values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInstallation' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/context:
    get:
      tags: [Apps]
      operationId: getAppTargetContext
      summary: The settings and connection status an app frame gets on a target
      description: Studio's page reads this before it loads a frame and adds it to the frame's context (`settings`, `connections`). With `targetId` of an infrastructure, only users who may open it are answered; workspaces and frames without a target get installation values and defaults, and no bindings (ADR 0048).
      x-requirements: [APP-025, CON-002, CON-003]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - name: targetId
          in: query
          schema: { $ref: '#/components/schemas/TargetId' }
      responses:
        '200':
          description: Resolved settings and connection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTargetContext' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/compatibility:
    get:
      tags: [Apps]
      operationId: evaluateInstalledAppCompatibility
      summary: Evaluate technical compatibility and semantic applicability separately
      x-requirements: [APP-003, APP-009, UX-002]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - name: targetId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TargetId' }
        - name: contextResourceKey
          in: query
          schema: { $ref: '#/components/schemas/ResourceKey' }
      responses:
        '200':
          description: Compatibility and applicability with end-user explanations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEvaluation' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/activations:
    post:
      tags: [Apps, Operations]
      operationId: activateAppInstallation
      summary: Activate a verified installation for an allowed target and user context
      x-requirements: [APP-003, APP-006, APP-010, APP-011, SEC-006]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppActivationRequest' }
      responses:
        '202':
          description: Activation operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Apps]
      operationId: deactivateAppInstallation
      summary: Stop or disable an app installation while retaining installed artifacts
      x-requirements: [APP-004, APP-005, APP-010]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: App deactivated }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/updates:
    post:
      tags: [Apps, Operations]
      operationId: updateAppInstallation
      summary: Verify and stage an immutable app version while retaining rollback state
      x-requirements: [APP-011, APP-012, APP-013]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppUpdateRequest' }
      responses:
        '202':
          description: Update operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/rollbacks:
    post:
      tags: [Apps, Operations]
      operationId: rollbackAppInstallation
      summary: Roll back to a previously verified retained version
      x-requirements: [APP-011, APP-013, UX-003]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppRollbackRequest' }
      responses:
        '202':
          description: Rollback operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /app-installations/{installationId}/visibility:
    get:
      tags: [Apps]
      operationId: getAppVisibility
      summary: Get user/group visibility independently from installation scope
      x-requirements: [APP-004, APP-005, SEC-006]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: Visibility rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleSet' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Apps]
      operationId: replaceAppVisibility
      summary: Replace user/group visibility without changing approved capabilities
      x-requirements: [APP-004, APP-005, SEC-006]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRuleSet' }
      responses:
        '200':
          description: Updated visibility rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleSet' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /app-contributions:
    get:
      tags: [Apps]
      operationId: listAppContributions
      summary: Modules of the installed apps, and the submodel views for submodel semantic IDs, with the reason for each match
      x-requirements: [APP-003]
      parameters:
        - name: semanticId
          in: query
          description: Submodel semantic IDs; submodel views are returned only for given IDs. Repeat the parameter for several submodels, for example a shell's overview (MVP-4).
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Applicable contributions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppContributions' }
        default: { $ref: '#/components/responses/Problem' }

  /app-calls:
    post:
      tags: [Apps]
      operationId: callAppCapability
      summary: Capability call on behalf of an installed app (ADR 0018)
      description: |
        Called by the host bridge for an app frame (session cookie, Origin and
        CSRF checks) or by a backend app with a short-lived capability token
        (`Authorization: Bearer sct.…`, ADR 0019). Studio checks the method
        against the installed manifest's permissions and opens the target with
        the calling user's rights. Refusals and writes are audited with the
        installation. Desktop bundled apps may also call studio.containers.*
        (ADR 0033), without a target. This authority is refused to uploaded
        apps and backend callers and is unavailable in hosted Studio.
        Lifecycle methods return jobs polled with studio.containers.getJob;
        export/import/log saving use native file grants added by the host.
        Bundled apps may call studio.timeseries.read (ADR 0040): Studio reads
        the Time Series Data submodel from the frame's target as the user
        and, for a LinkedSegment, queries the database of a connection of the
        same infrastructure; the app never sends a URL, query or credential.
        Every use of a connection and every refusal is audited.
        Structural writes (studio.aas.createShell, createSubmodel,
        putSubmodel, addElement, putElement, deleteElement, deleteSubmodel,
        deleteShell; ADR 0049) run the editor's code paths with revisions,
        AAS Core findings, registry sync and the workspace undo log. They need
        `mode: edit`, which the host bridge sends from Studio's own state and a
        backend's capability token carries; otherwise `app_edit_mode_required`.
        studio.aas.putAttachment is sent to `/app-calls/attachment` instead.

        Apps with `studio.connections` call studio.connections.call
        (ADR 0047), from frames and backends: an operation their manifest
        declares for one of its `connections`, through the `http` connection
        of the target's infrastructure that binds it (`apps`). Studio
        validates the parameters and the body against the operation's OpenAPI
        schemas, sends the request to the connection's URL with its
        credentials, refuses redirects, and returns every status as a result
        (`ConnectionCallResult`). Bytes travel as base64 in this binding
        (`ConnectionCallParams`); Studio's page and the backend harness give
        apps `Uint8Array`s. Every call and every refusal is audited.
      x-requirements: [APP-006, APP-008, APP-009, APP-010, APP-017, SEC-005, CON-002, CON-003, CON-004, CON-006]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCallRequest' }
      responses:
        '200':
          description: Result of the method
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCallResult' }
        default: { $ref: '#/components/responses/Problem' }

  /app-calls/attachment:
    put:
      tags: [Apps]
      operationId: putAppAttachment
      summary: studio.aas.putAttachment from the host bridge (ADR 0049)
      description: |
        Studio's page sends the bytes an app frame handed it as the body, with
        the File element and the rest of the call in the query. Authorized and
        audited like `/app-calls` (permission `studio.aas.write`, edit mode),
        with the attachment route's checks: `STUDIO_ALLOW_UPLOADS`, at most
        8 MiB and the deployment's upload limit, and the element's revision.
        Backend apps cannot call it.
      x-requirements: [APP-017, SEC-005, DATA-009]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: installationId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: digest, in: query, schema: { type: string, maxLength: 80 } }
        - { name: targetId, in: query, required: true, schema: { $ref: '#/components/schemas/TargetId' } }
        - { name: shellId, in: query, schema: { type: string, maxLength: 4000 } }
        - { name: mode, in: query, required: true, schema: { enum: [view, edit] } }
        - { name: submodelId, in: query, required: true, schema: { type: string, maxLength: 2048 } }
        - { name: idShortPath, in: query, required: true, schema: { type: string, maxLength: 4000 } }
        - { name: fileName, in: query, required: true, schema: { type: string, maxLength: 255 } }
        - { name: revision, in: query, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          '*/*':
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        '200':
          description: The File element after the upload, with its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCallResult' }
        default: { $ref: '#/components/responses/Problem' }

  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      summary: Poll bounded long-running copy and app lifecycle operations
      x-requirements: [OPS-007]
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/OperationKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OperationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Operation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationPage' }
        default: { $ref: '#/components/responses/Problem' }

  /operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Poll one durable operation as the portable fallback to SSE
      x-requirements: [DATA-015, OPS-007]
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Current operation state
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Problem' }

  /operations/{operationId}/events:
    get:
      tags: [Operations]
      operationId: streamOperationEvents
      summary: Observe one-way progress and outcomes with Server-Sent Events
      description: Clients reconnect with `Last-Event-ID`. Polling `GET /operations/{operationId}` remains the required fallback. No command messages are accepted on this stream.
      x-requirements: [OPS-007]
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: SSE stream containing typed JSON event data
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schema:
                $ref: '#/components/schemas/OperationEvent'
        default: { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [Context, Targets, Views]
      operationId: streamStudioEvents
      summary: Observe bounded notifications and cache invalidations with SSE
      description: The stream is one-way and topic-filtered. It is not a generic command protocol. Clients refresh affected resources through ordinary HTTP and may use bounded polling when SSE is unavailable.
      x-requirements: [DATA-010, VIEW-011, OPS-007]
      parameters:
        - name: topics
          in: query
          required: true
          description: Bounded event topics authorized for this session.
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items:
              type: string
              enum: [target, aas, view, app, notification]
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: SSE notification and invalidation stream
          content:
            text/event-stream:
              schema: { type: string }
              x-event-schema:
                $ref: '#/components/schemas/StudioEvent'
        default: { $ref: '#/components/responses/Problem' }

  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List authorized durable audit summaries for administration and operation diagnosis
      description: Audit records never include OAuth tokens, credentials, transferred AAS contents, AASX contents, request/response bodies, or arbitrary app logs.
      x-requirements: [SEC-005, OPS-004, OPS-006]
      parameters:
        - name: targetId
          in: query
          schema: { $ref: '#/components/schemas/TargetId' }
        - name: operationId
          in: query
          schema: { $ref: '#/components/schemas/OperationId' }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    studioSession:
      type: apiKey
      in: cookie
      name: basyx_studio_session
      description: Opaque server-side Studio session. In hosted production the cookie is HttpOnly, Secure, and SameSite; it never contains or exposes a downstream token.

  parameters:
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TargetId' }
    ResourceKey:
      name: resourceKey
      in: path
      required: true
      description: Opaque, URL-safe, target-scoped resource key returned by Studio. It prevents arbitrary AAS identifiers and downstream URLs from being interpreted as routing input.
      schema: { $ref: '#/components/schemas/ResourceKey' }
    InfrastructureId:
      name: infrastructureId
      in: path
      required: true
      description: ID of a live infrastructure; the same value is its target ID.
      schema: { $ref: '#/components/schemas/TargetId' }
    ShellKey:
      name: shellKey
      in: path
      required: true
      description: Resource key of a shell, as returned in `ShellSummary.key`.
      schema: { $ref: '#/components/schemas/ResourceKey' }
    SubmodelKey:
      name: submodelKey
      in: path
      required: true
      description: Resource key of a submodel, as returned in `SubmodelRef.key`.
      schema: { $ref: '#/components/schemas/ResourceKey' }
    ElementKey:
      name: elementKey
      in: path
      required: true
      description: Resource key of a submodel element or operation variable, as returned in `TreeNode.key`.
      schema: { $ref: '#/components/schemas/ResourceKey' }
    PointInTime:
      name: at
      in: query
      description: Point in time (ISO 8601 with offset) for a historic version; needs the `history` capability.
      schema: { type: string, format: date-time }
    FileName:
      name: fileName
      in: query
      description: Name of the uploaded file, without path separators.
      schema: { type: string, minLength: 1, maxLength: 255 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkspaceId' }
    CopyPlanId:
      name: copyPlanId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CopyPlanId' }
    ViewId:
      name: viewId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ViewId' }
    AppId:
      name: appId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AppId' }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/InstallationId' }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OperationId' }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor obtained from the preceding page.
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdShortFilter:
      name: idShort
      in: query
      schema: { type: string, maxLength: 128 }
    SemanticIdFilter:
      name: semanticId
      in: query
      schema: { type: string, maxLength: 2048 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound anti-CSRF value obtained from the session bootstrap response. Deployments additionally enforce same-origin policy.
      schema: { type: string, minLength: 32, maxLength: 4096 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong target- or Studio-resource revision ETag on which the command is based.
      schema: { type: string, minLength: 3, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key scoped to user, route, and target or operation context.
      schema: { type: string, minLength: 16, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Required by the server for write or invoke actions; unnecessary for reads.
      schema: { type: string, minLength: 16, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last processed bounded event identifier used to resume an SSE stream.
      schema: { type: string, maxLength: 200 }

  headers:
    XRequestId:
      description: Canonical request identifier generated or validated by Studio.
      schema: { type: string, minLength: 1, maxLength: 200 }
    XCorrelationId:
      description: Canonical correlation identifier propagated across Studio and downstream BaSyx calls.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ETag:
      description: Strong opaque revision for optimistic concurrency.
      schema: { type: string }
    Location:
      description: Relative URI of the created resource or accepted operation.
      schema: { type: string, format: uri-reference }
    RetryAfter:
      description: Suggested bounded polling delay in seconds.
      schema: { type: integer, minimum: 1, maximum: 60 }

  responses:
    Problem:
      description: Normalized Studio or downstream failure. Downstream response bodies, stack traces, URLs with credentials, tokens, secrets, and package contents are never forwarded.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: The opaque Studio session is absent or expired. Target-specific reauthentication uses a typed target state/problem and does not masquerade as a missing Studio session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: The resource does not exist or is intentionally concealed from this subject.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Business-state conflict, target authentication requirement, identifier collision, idempotency conflict, or operation-state conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: The supplied revision is stale. The user's draft remains client-owned and is not discarded.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: A required revision, confirmation, target selection, or other explicit precondition is missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Configured upload, archive, uncompressed-size, entry-count, or stream limit exceeded.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The media type or detected package/file content is unsupported.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Syntactically valid input failed Studio schema, AAS Core, package, semantic, compatibility, or policy validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AasResource:
      description: Target-scoped AAS resource
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AasResource' }
    AasResourceCreated:
      description: Target-scoped AAS resource created
      headers:
        Location: { $ref: '#/components/headers/Location' }
        ETag: { $ref: '#/components/headers/ETag' }
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AasResource' }

  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 200
      pattern: '^[A-Za-z0-9_-]+$'
    TargetId:
      $ref: '#/components/schemas/OpaqueId'
    ResourceKey:
      type: string
      minLength: 1
      maxLength: 4000
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque, URL-safe, target-scoped key (base64url of an AAS identifier or element locator). Clients use keys only as returned by Studio.
    WorkspaceId:
      $ref: '#/components/schemas/OpaqueId'
    CopyPlanId:
      $ref: '#/components/schemas/OpaqueId'
    ViewId:
      $ref: '#/components/schemas/OpaqueId'
    InstallationId:
      $ref: '#/components/schemas/OpaqueId'
    OperationId:
      $ref: '#/components/schemas/OpaqueId'
    AppId:
      type: string
      minLength: 3
      maxLength: 200
      pattern: '^[a-z0-9][a-z0-9._-]+$'
    Revision:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque target- or Studio-resource revision. Clients compare it for equality and also receive it as an ETag.
    Timestamp:
      type: string
      format: date-time
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'], maxLength: 2048 }
        hasMore: { type: boolean }
    Permission:
      type: string
      enum:
        - target.read
        - target.configure
        - aas.create
        - aas.read
        - aas.update
        - aas.delete
        - aas.operation.invoke
        - file.read
        - file.write
        - copy.plan
        - copy.execute
        - workspace.manage
        - view.open
        - view.author
        - view.share
        - app.install
        - app.activate
        - app.manageVisibility
        - audit.read
    PermissionSet:
      type: object
      additionalProperties: false
      required: [granted]
      properties:
        granted:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Permission' }
        denied:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Permission' }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 500 }
    DeploymentMode:
      type: string
      enum: [hosted, desktop]
    DeploymentCapability:
      type: string
      enum:
        - liveTargets
        - localWorkspaces
        - nativeFileBroker
        - appInstallation
        - backendApps
        - privilegedApps
        - automaticUpdates
        - serverSentEvents
        - viewSharing
    StudioContext:
      type: object
      additionalProperties: false
      required: [studioVersion, apiVersion, deploymentMode, capabilities, session]
      properties:
        studioVersion: { type: string }
        apiVersion: { type: string, const: '1' }
        deploymentMode: { $ref: '#/components/schemas/DeploymentMode' }
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/DeploymentCapability' }
        supportedAasMetamodelVersions:
          type: array
          items: { type: string }
        session: { $ref: '#/components/schemas/Session' }
        loginRequired: { type: boolean, description: Users sign in to Studio (OIDC). }
        anonymous: { type: boolean, description: 'Hosted without login (STUDIO_AUTH_MODE=none, ADR 0036).' }
        infrastructuresEditable: { type: boolean, description: 'Administrators may change infrastructures (STUDIO_INFRASTRUCTURES_EDITABLE, ADR 0037).' }
        product:
          type: object
          description: Product name, version and build (ADR 0035).
          properties:
            name: { type: string }
            version: { type: string }
            commit: { type: [string, 'null'] }
            buildDate: { type: [string, 'null'] }
        branding:
          type: object
          description: Logos (absolute URL or Studio path under the base path) and default accent; null keeps BaSyx's.
          properties:
            logoLight: { type: [string, 'null'] }
            logoDark: { type: [string, 'null'] }
            accentLight: { type: [string, 'null'] }
            accentDark: { type: [string, 'null'] }
        legal:
          type: object
          properties:
            copyrightName: { type: [string, 'null'] }
            legalNoticeUrl: { type: [string, 'null'] }
            privacyPolicyUrl: { type: [string, 'null'] }
        features:
          type: object
          description: Deployment switches; they only narrow what roles allow.
          properties:
            readOnly: { type: boolean }
            uploads: { type: boolean }
            appInstalls: { type: boolean }
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, roles, groups]
      properties:
        id: { type: string, minLength: 1, maxLength: 500 }
        displayName: { type: string, minLength: 1, maxLength: 300 }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, maxLength: 200 }
        groups:
          type: array
          uniqueItems: true
          maxItems: 1000
          items: { type: string, maxLength: 500 }
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, csrfToken]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        csrfToken:
          type: string
          minLength: 32
          maxLength: 4096
          description: Session-bound value for the X-CSRF-Token header; this is not an authentication token.
        activeTargetId:
          oneOf:
            - $ref: '#/components/schemas/TargetId'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        permissions: { $ref: '#/components/schemas/PermissionSet' }
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          type: string
          format: uri-reference
          maxLength: 2048
          description: Same-origin relative route validated by the BFF.
    AuthorizationInstruction:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [navigation_required, connected]
        authorizationUrl:
          type: string
          format: uri
          maxLength: 4096
          description: Validated authorization URL for browser or system-browser navigation; never contains a Studio or downstream access token.
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        targetId: { $ref: '#/components/schemas/TargetId' }
    TargetAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          type: string
          format: uri-reference
          maxLength: 2048
    TargetKind:
      type: string
      enum: [live, workspace]
      description: '`live` is a configured infrastructure, `workspace` an AASX package opened in the desktop app.'
    TargetAuthenticationState:
      type: string
      enum: [not_required, authenticated, required]
    TargetCapabilities:
      type: object
      additionalProperties: false
      description: What a target supports. Feature code branches on capabilities, never on the target kind. Optional server features are `true` only where the server announces them in its service profiles (ADR 0021).
      required: [write, writeStructure, persistence, deleteShells, files, operations, conceptDescriptions, search, queryTarget, elementSearch, discovery, export, upload, history, changeFeed, sharing, listSource, submodelListSource, submodelSearch]
      properties:
        write: { type: boolean, description: Change values of elements. }
        writeStructure: { type: boolean, description: 'Add, delete, move and rename elements and edit submodel metadata (MVP-5).' }
        persistence:
          type: string
          enum: [immediate, explicit_save]
          description: '`immediate` writes reach the source on apply (live targets); `explicit_save` keeps applied changes until the user saves (workspaces).'
        deleteShells: { type: boolean }
        files:
          type: boolean
          description: Read File elements and thumbnails, and replace File contents.
        operations: { type: boolean }
        conceptDescriptions: { type: boolean }
        search:
          type: string
          enum: [query, expression, filter]
          description: How shells are searched (ADR 0024). `query` runs the AAS Query Language on the server, `expression` is evaluated by Studio (workspaces), `filter` only filters the loaded list.
        queryTarget:
          type: [string, 'null']
          enum: [registry, repository, null]
          description: 'Where shell queries run with `search: query`; raw queries use that service''s roots.'
        elementSearch:
          type: boolean
          description: Submodel elements can be searched (the palette).
        discovery:
          type: boolean
          description: Find shells by asset ID through an AAS discovery.
        export:
          type: boolean
          description: Download a shell with its submodels as AASX, JSON, or XML.
        upload:
          type: boolean
          description: Add the content of an AASX, JSON, or XML file.
        history:
          type: boolean
          description: Read submodels and shells as they were at a point in time.
        changeFeed:
          type: boolean
          description: Read the change events of shells, submodels, and assets.
        sharing:
          type: boolean
          description: Grant other users access to a shell (BaSyx Go ReBAC, as the signed-in user).
        listSource:
          type: string
          enum: [registry, repository]
          description: Where the shell list comes from; registry entries may point to shells that cannot be opened.
        submodelListSource:
          type: [string, 'null']
          enum: [registry, repository, null]
          description: Where the list of submodels on their own comes from (the infrastructure's list source where it has both services); `null` where submodels are served only through their shell, which hides the submodel view.
        submodelSearch:
          type: string
          enum: [query, expression, filter]
          description: How submodels are searched; `query` runs on the submodel repository.
    TargetWorkspaceState:
      type: object
      additionalProperties: false
      required: [fileName, unsavedChanges]
      properties:
        fileName: { type: string }
        unsavedChanges: { type: boolean }
    SyncMode:
      type: string
      enum: [autoCreate, dontCreate]
      description: Whether Studio writes registry descriptors and discovery asset links after uploads and removes them after deletes, where the server does not (ADR 0020).
    Target:
      type: object
      additionalProperties: false
      required: [id, kind, name, description, securityMode, authenticationState, capabilities, workspace, registrySync]
      properties:
        id: { $ref: '#/components/schemas/TargetId' }
        kind: { $ref: '#/components/schemas/TargetKind' }
        name: { type: string }
        description: { type: [string, 'null'] }
        securityMode:
          description: Downstream security mode of a live target; `null` for workspaces.
          oneOf:
            - { $ref: '#/components/schemas/InfrastructureSecurityMode' }
            - { type: 'null' }
        authenticationState: { $ref: '#/components/schemas/TargetAuthenticationState' }
        capabilities: { $ref: '#/components/schemas/TargetCapabilities' }
        workspace:
          description: State of a desktop AASX workspace; `null` for live targets.
          oneOf:
            - { $ref: '#/components/schemas/TargetWorkspaceState' }
            - { type: 'null' }
        registrySync:
          description: The infrastructure's sync default and whether users may choose their own (preference `syncOverrides`); `null` where the server keeps registries and discovery in step itself, or has none.
          oneOf:
            - type: object
              additionalProperties: false
              required: [studioDefault, userOverride]
              properties:
                studioDefault: { $ref: '#/components/schemas/SyncMode' }
                userOverride: { type: boolean }
            - { type: 'null' }
    TargetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Target' }
    ActivateTargetRequest:
      type: object
      additionalProperties: false
      required: [draftDisposition]
      properties:
        draftDisposition:
          type: string
          enum: [none, saved, discarded]
          description: UI decision about any prior target's unsaved client-owned draft. The server never silently discards it.
    ActiveTargetContext:
      type: object
      additionalProperties: false
      required: [target, initialShells]
      properties:
        target: { $ref: '#/components/schemas/Target' }
        initialShells: { $ref: '#/components/schemas/AasResourcePage' }
    InfrastructureSecurityMode:
      type: string
      enum: [delegated_user, deployment_client_credentials, unsecured]
      description: '`unsecured` is allowed only for explicitly configured trusted local development and still uses the same authorization, endpoint-validation, and audit controls.'
    InfrastructureTemplate:
      type: string
      enum: [full, mono-all, mono-repo, identifiable]
      description: |
        How an infrastructure is deployed, as in the BaSyx AAS Web UI (ADR 0020):
        `full` gives every service its own URL; `mono-all` serves every service
        from one AAS environment URL; `mono-repo` serves the repositories from an
        AAS environment, with registries and discovery on their own URLs;
        `identifiable` is an AAS repository only, whose submodels are reached
        through the shells that reference them.
    InfrastructureEndpointType:
      type: string
      enum: [aasEnvironment, aasRegistry, submodelRegistry, aasDiscovery, aasRepository, submodelRepository, conceptDescriptionRepository]
      description: An `aasEnvironment` serves every service the template assigns to it that has no endpoint of its own, plus the environment-only operations (serialization, upload).
    InfrastructureEndpoint:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: { $ref: '#/components/schemas/InfrastructureEndpointType' }
        url:
          type: string
          format: uri
          maxLength: 2000
          description: HTTP(S) base URL. Accepted only from an authorized administrator and revalidated by SSRF defenses on redirects and DNS changes.
    InfrastructureSyncSettings:
      type: object
      additionalProperties: false
      properties:
        serverSyncsRegistry:
          type: boolean
          default: true
          description: The server keeps its registries in step with its repositories (BaSyx Go registry integration).
        serverSyncsDiscovery:
          type: boolean
          default: true
          description: The server keeps the discovery's asset links in step with its shells.
        studioDefault:
          allOf:
            - { $ref: '#/components/schemas/SyncMode' }
          default: autoCreate
          description: Where the server does not, Studio writes descriptors and asset links after uploads and deletes, or not.
        userOverride:
          type: boolean
          default: false
          description: Whether users may choose differently for themselves.
    SecretInput:
      description: A deployment secret reference (`env:NAME`, `file:/path`; required in hosted Studio) or a value that the desktop Studio stores encrypted with a key held in the OS credential store.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref: { type: string, pattern: '^(?:env:[A-Z_][A-Z0-9_]*|file:/\S+)$' }
        - type: object
          additionalProperties: false
          required: [value]
          properties:
            value: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    SecretSummary:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: { type: string, enum: [env, file, stored] }
        ref:
          type: [string, 'null']
          description: The reference for env and file secrets; never the secret value.
    ClientCertificateInput:
      description: |
        A TLS client certificate (mutual TLS) as a PKCS#12 bundle (ADR 0025):
        a file reference with an optional passphrase reference (hosted and
        desktop), or an uploaded bundle with its passphrase that the desktop
        Studio stores encrypted (rejected in hosted Studio). The bundle must open
        with the passphrase, contain a key and a matching certificate, and be
        valid now; problems are violations on `clientCertificate`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref: { type: string, pattern: '^file:/\S+$' }
            passphraseRef: { type: string, pattern: '^(?:env:[A-Z_][A-Z0-9_]*|file:/\S+)$' }
        - type: object
          additionalProperties: false
          required: [value]
          properties:
            value: { type: string, format: byte, maxLength: 131072, writeOnly: true, description: The .p12/.pfx file, base64-encoded. }
            passphrase: { type: string, maxLength: 4096, default: '', writeOnly: true }
    ClientCertificateSummary:
      type: object
      additionalProperties: false
      description: The stored client certificate; never the bundle, key or passphrase.
      required: [kind, ref, passphraseRef, subject, issuer, notAfter]
      properties:
        kind: { type: string, enum: [file, stored] }
        ref: { type: [string, 'null'], description: The bundle's path for file certificates. }
        passphraseRef: { type: [string, 'null'], description: The passphrase reference for file certificates. }
        subject: { type: string }
        issuer: { type: string }
        notAfter: { $ref: '#/components/schemas/Timestamp' }
    OidcClientSettings:
      type: object
      required: [issuer, clientId, scopes]
      properties:
        issuer: { type: string, format: uri, maxLength: 2000 }
        clientId: { type: string, minLength: 1, maxLength: 500 }
        scopes:
          type: array
          maxItems: 20
          items: { type: string }
    InfrastructureSecurityInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: unsecured }
        - allOf:
            - { $ref: '#/components/schemas/OidcClientSettings' }
            - type: object
              required: [mode]
              properties:
                mode: { const: deployment_client_credentials }
                clientSecret:
                  allOf:
                    - { $ref: '#/components/schemas/SecretInput' }
                  description: Required on create; omit on update to keep the stored secret.
        - allOf:
            - { $ref: '#/components/schemas/OidcClientSettings' }
            - type: object
              required: [mode]
              properties:
                mode: { const: delegated_user }
                clientSecret:
                  allOf:
                    - { $ref: '#/components/schemas/SecretInput' }
                  description: Confidential hosted clients only; desktop clients are public (RFC 8252).
                desktopLoopbackHost:
                  type: string
                  enum: ['127.0.0.1', localhost]
                  default: '127.0.0.1'
                  description: Loopback host registered at the IdP for the desktop client.
    InfrastructureSecuritySummary:
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode: { const: unsecured }
        - allOf:
            - { $ref: '#/components/schemas/OidcClientSettings' }
            - type: object
              required: [mode, clientSecret]
              properties:
                mode: { const: deployment_client_credentials }
                clientSecret:
                  oneOf:
                    - { $ref: '#/components/schemas/SecretSummary' }
                    - { type: 'null' }
        - allOf:
            - { $ref: '#/components/schemas/OidcClientSettings' }
            - type: object
              required: [mode, clientSecret, desktopLoopbackHost]
              properties:
                mode: { const: delegated_user }
                clientSecret:
                  oneOf:
                    - { $ref: '#/components/schemas/SecretSummary' }
                    - { type: 'null' }
                desktopLoopbackHost: { type: string, enum: ['127.0.0.1', localhost] }
    InfrastructureInput:
      type: object
      additionalProperties: false
      required: [name, endpoints, security]
      description: The template decides which endpoint types are allowed and which are required; violations are reported per endpoint (ADR 0020).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        template:
          allOf:
            - { $ref: '#/components/schemas/InfrastructureTemplate' }
          default: full
        endpoints:
          type: array
          minItems: 1
          maxItems: 7
          description: Each endpoint type at most once.
          items: { $ref: '#/components/schemas/InfrastructureEndpoint' }
        listSource:
          type: string
          enum: [registry, repository]
          default: registry
          description: Where the shell list comes from when both an AAS registry and an AAS repository are there. There is no automatic fallback.
        sync:
          allOf:
            - { $ref: '#/components/schemas/InfrastructureSyncSettings' }
          default: {}
        security: { $ref: '#/components/schemas/InfrastructureSecurityInput' }
        clientCertificate:
          oneOf:
            - { $ref: '#/components/schemas/ClientCertificateInput' }
            - { type: 'null' }
          description: Presented on every HTTPS connection for this infrastructure, including its IdP, in every access mode. Omit on update to keep the stored certificate; `null` removes it.
        allowPrivateNetwork:
          type: boolean
          default: false
          description: Permit loopback and private-network addresses; subject to the deployment policy.
        connections:
          type: array
          maxItems: 20
          default: []
          description: Third-party services that content of this infrastructure refers to (ADR 0040), or that bound apps call (`http`, ADR 0047). Keys are unique; `delegatedUser` needs `delegated_user` security; an app connection is bound at most once per infrastructure.
          items: { $ref: '#/components/schemas/ConnectionInput' }
        apps:
          type: array
          maxItems: 50
          default: []
          description: Values of apps' `infrastructure` settings on this infrastructure, by app ID, each app at most once (ADR 0048). For an installed app, every key must be such a setting and accept its value; entries for apps that are not installed are kept.
          items: { $ref: '#/components/schemas/InfrastructureAppSettings' }
    ConnectionAuthInput:
      description: |
        How Studio authenticates at the service (CON-007). Each connection
        type accepts some schemes (`influxdb2`: `token`; `http`: all). Secrets are
        `SecretInput`s; omit one on update to keep the stored secret of the
        same key and scheme.
      oneOf:
        - { type: object, additionalProperties: false, required: [scheme], properties: { scheme: { const: none } } }
        - type: object
          additionalProperties: false
          required: [scheme]
          description: 'Sent as `Authorization: Token <secret>`.'
          properties: { scheme: { const: token }, token: { $ref: '#/components/schemas/SecretInput' } }
        - type: object
          additionalProperties: false
          required: [scheme]
          description: 'Sent as `Authorization: Bearer <secret>`.'
          properties: { scheme: { const: bearer }, token: { $ref: '#/components/schemas/SecretInput' } }
        - type: object
          additionalProperties: false
          required: [scheme, name]
          properties:
            scheme: { const: header }
            name: { type: string, pattern: "^[!#$%&'*+.^\\w`|~-]{1,100}$", description: 'Not a header Studio sets itself (Host, Content-Type, Accept, …).' }
            value: { $ref: '#/components/schemas/SecretInput' }
        - type: object
          additionalProperties: false
          required: [scheme, username]
          properties:
            scheme: { const: basic }
            username: { type: string, minLength: 1, maxLength: 500, pattern: '^[^:]*$' }
            password: { $ref: '#/components/schemas/SecretInput' }
        - type: object
          additionalProperties: false
          required: [scheme, issuer, clientId]
          description: A token from the issuer's token endpoint, cached until it expires.
          properties:
            scheme: { const: oauth2ClientCredentials }
            issuer: { type: string, format: uri, maxLength: 2000 }
            clientId: { type: string, minLength: 1, maxLength: 500 }
            clientSecret: { $ref: '#/components/schemas/SecretInput' }
            scopes: { type: array, maxItems: 20, items: { type: string }, default: [] }
            audience: { type: string, maxLength: 500 }
        - type: object
          additionalProperties: false
          required: [scheme, audience]
          description: The signed-in user's token for this infrastructure, exchanged for the audience (RFC 8693) or, with `forwardUserToken`, forwarded if its `aud` contains the audience.
          properties:
            scheme: { const: delegatedUser }
            audience: { type: string, minLength: 1, maxLength: 500 }
            scopes: { type: array, maxItems: 20, items: { type: string }, default: [] }
            forwardUserToken: { type: boolean, default: false }
    ConnectionAuthSummary:
      description: The authentication of a stored connection; secrets as `SecretSummary`, never their values.
      type: object
      required: [scheme]
      properties:
        scheme: { type: string, enum: [none, token, bearer, header, basic, oauth2ClientCredentials, delegatedUser] }
      additionalProperties: true
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [key, type, url, auth]
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        type: { type: string, enum: [influxdb2, http], description: 'The API the service speaks; selects the adapter and the schema of `settings`. `http`: a service that bound apps call through the operations they declare (ADR 0047).' }
        url: { type: string, format: uri, maxLength: 2000, description: 'How the Studio Service reaches the service; without credentials, query or fragment. Requests go here only.' }
        aliases:
          type: array
          maxItems: 10
          default: []
          description: Other origins under which AAS content refers to the service; never contacted. Empty for `http`.
          items: { type: string, format: uri, maxLength: 2000 }
        allowPrivateNetwork: { type: boolean, default: false }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 120, description: "Overrides the adapter's default (`influxdb2` 15 s, `http` 30 s)." }
        auth: { $ref: '#/components/schemas/ConnectionAuthInput' }
        settings:
          type: object
          additionalProperties: false
          default: {}
          description: 'Per type. `influxdb2`: `organization` replaces the `org`/`orgID` of endpoints in AAS content. `http`: none.'
          properties:
            organization: { type: string, minLength: 1, maxLength: 200 }
        apps:
          type: array
          maxItems: 50
          default: []
          description: '`http` only: the app connections that may call this service (ADR 0047), by app ID and the `id` of a connection in its manifest.'
          items: { $ref: '#/components/schemas/ConnectionBinding' }
    AppSettingValue:
      description: A setting's value (ADR 0048). Not for secrets.
      oneOf:
        - { type: string, maxLength: 2000 }
        - { type: number }
        - { type: boolean }
        - { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
    AppSettingValues:
      type: object
      maxProperties: 32
      propertyNames: { pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
      additionalProperties: { $ref: '#/components/schemas/AppSettingValue' }
    InfrastructureAppSettings:
      type: object
      additionalProperties: false
      required: [app]
      properties:
        app: { $ref: '#/components/schemas/AppId' }
        settings: { $ref: '#/components/schemas/AppSettingValues' }
    AppSettingsUpdate:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          maxProperties: 32
          description: The installation's values; `null` or a missing key leaves a setting without one.
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/AppSettingValue' }
              - { type: 'null' }
    AppTargetContext:
      type: object
      additionalProperties: false
      required: [settings, connections]
      description: What Studio's page adds to an app frame's context on a target (ADR 0048).
      properties:
        settings:
          type: object
          description: Every declared setting with its value for the target (the infrastructure's, else the installation's, else the default), or `null`.
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/AppSettingValue' }
              - { type: 'null' }
        connections:
          type: object
          description: Per declared connection, whether an `http` connection of the target's infrastructure binds it (ADR 0047). Nothing else of the connection.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [bound]
            properties:
              bound: { type: boolean }
    ConnectionBinding:
      type: object
      additionalProperties: false
      required: [app, connection]
      properties:
        app: { $ref: '#/components/schemas/AppId' }
        connection: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    Connection:
      type: object
      additionalProperties: false
      required: [key, type, url, aliases, allowPrivateNetwork, auth, settings]
      properties:
        key: { type: string }
        type: { type: string, enum: [influxdb2, http] }
        url: { type: string }
        aliases: { type: array, items: { type: string } }
        allowPrivateNetwork: { type: boolean }
        timeoutSeconds: { type: integer }
        auth: { $ref: '#/components/schemas/ConnectionAuthSummary' }
        settings: { type: object }
        apps:
          type: array
          description: '`http` only.'
          items: { $ref: '#/components/schemas/ConnectionBinding' }
    ConnectionTestResult:
      type: object
      additionalProperties: false
      required: [checkedAt, ok, checks]
      properties:
        checkedAt: { $ref: '#/components/schemas/Timestamp' }
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [check, ok, status, latencyMs, message]
            properties:
              check: { type: string, enum: [token, health, query], description: '`token` obtains the credentials, `health` reaches the service, `query` reads with them.' }
              ok: { type: boolean }
              status: { type: [integer, 'null'] }
              latencyMs: { type: [number, 'null'] }
              message: { type: [string, 'null'], description: What went wrong; never contains the secret. }
    ServiceProfiles:
      type: object
      description: The `/description` profiles of each endpoint at the last probe, per endpoint type; `null` where the endpoint did not answer with them.
      propertyNames: { $ref: '#/components/schemas/InfrastructureEndpointType' }
      additionalProperties:
        type: [array, 'null']
        items: { type: string }
    Infrastructure:
      type: object
      additionalProperties: false
      required: [id, name, description, template, endpoints, listSource, sync, serviceProfiles, probedAt, announced, security, clientCertificate, allowPrivateNetwork, connections, apps, managed, revision, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/TargetId' }
        name: { type: string }
        description: { type: [string, 'null'] }
        template: { $ref: '#/components/schemas/InfrastructureTemplate' }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/InfrastructureEndpoint' }
        listSource: { type: string, enum: [registry, repository] }
        sync:
          allOf:
            - { $ref: '#/components/schemas/InfrastructureSyncSettings' }
          required: [serverSyncsRegistry, serverSyncsDiscovery, studioDefault, userOverride]
        serviceProfiles: { $ref: '#/components/schemas/ServiceProfiles' }
        probedAt:
          type: [string, 'null']
          format: date-time
          description: When the profiles were read; `null` before the first successful probe.
        announced:
          type: object
          additionalProperties: false
          required: [history, changeFeed, rebac]
          description: The optional features the services announce in their profiles.
          properties:
            history: { type: boolean }
            changeFeed: { type: boolean }
            rebac: { type: boolean }
        security: { $ref: '#/components/schemas/InfrastructureSecuritySummary' }
        clientCertificate:
          oneOf:
            - { $ref: '#/components/schemas/ClientCertificateSummary' }
            - { type: 'null' }
        allowPrivateNetwork: { type: boolean }
        connections:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        apps:
          type: array
          items: { $ref: '#/components/schemas/InfrastructureAppSettings' }
        managed:
          type: boolean
          description: Declared in the deployment's infrastructure file; read-only in Studio (ADR 0037).
        revision:
          type: integer
          description: Sent back as `If-Match` (`"<revision>"`) when replacing the configuration; also returned as `ETag`.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    InfrastructureList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Infrastructure' }
    InfrastructureProbeResult:
      type: object
      additionalProperties: false
      required: [checkedAt, endpoints]
      properties:
        checkedAt: { $ref: '#/components/schemas/Timestamp' }
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, reachable, status, latencyMs, error, profiles]
            properties:
              type: { $ref: '#/components/schemas/InfrastructureEndpointType' }
              reachable:
                type: boolean
                description: The endpoint answered `/description` below HTTP 500.
              status: { type: [integer, 'null'] }
              latencyMs: { type: [number, 'null'] }
              error: { type: [string, 'null'] }
              profiles:
                type: [array, 'null']
                items: { type: string }
                description: The service profiles from `/description`, if it answered with them.
    LangString:
      type: object
      additionalProperties: false
      required: [language, text]
      properties:
        language: { type: string }
        text: { type: string }
    ShellSummary:
      type: object
      additionalProperties: false
      required: [key, id, idShort, displayName, description, assetKind, globalAssetId, assetType, specificAssetIds, thumbnail, thumbnailUrl]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        id: { type: string }
        idShort: { type: [string, 'null'] }
        displayName:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        description:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        assetKind: { type: [string, 'null'] }
        globalAssetId: { type: [string, 'null'] }
        assetType: { type: [string, 'null'] }
        specificAssetIds:
          type: array
          description: The specific asset IDs with their name and value, as the AAS repository or registry returned them to the user.
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        thumbnail:
          type: boolean
          description: Whether the asset information names a default thumbnail.
        thumbnailUrl:
          type: [string, 'null']
          description: The thumbnail's address when it is an external http(s) URL, which the client loads directly; `null` otherwise.
    ShellSummaryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShellSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ShellSummaryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShellSummary' }
    ShellDetail:
      type: object
      additionalProperties: false
      required: [key, shell]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        shell: { $ref: '#/components/schemas/AasModelPayload' }
    ShellAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/ResourceKey' }
    ShellAvailability:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, status]
            properties:
              key: { $ref: '#/components/schemas/ResourceKey' }
              status: { type: string, enum: [available, forbidden, not_found, blocked, unreachable] }
    SearchRequest:
      type: object
      additionalProperties: false
      description: Give either `expression` or `query`. Elements are searched by text only (`expression`).
      properties:
        scope: { type: string, enum: [shells, submodels, elements], default: shells }
        expression:
          type: string
          maxLength: 2000
          description: The search field's expression; empty lists all shells.
        query:
          type: object
          description: A raw AAS Query Language query (IDTA-01002-3) from the advanced dialog; at most 64 KiB.
          unevaluatedProperties: true
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        cursor: { type: string, maxLength: 4000 }
      oneOf:
        - required: [expression]
        - required: [query]
    ShellSearchPage:
      type: object
      additionalProperties: false
      required: [items, page, endpoint]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShellSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
        endpoint:
          type: string
          enum: [registry, repository, workspace]
          description: Which service answered.
    SubmodelSummary:
      type: object
      additionalProperties: false
      required: [key, id, idShort, displayName, description, kind, semanticId, administration]
      description: A submodel of the submodel list, from the repository's metadata or the registry's descriptor.
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        id: { type: string }
        idShort: { type: [string, 'null'] }
        displayName:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        description:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        kind:
          type: [string, 'null']
          description: '`Template` or `Instance` (an omitted kind is `Instance`); `null` for registry descriptors, which do not carry it.'
        semanticId: { type: [string, 'null'] }
        administration:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [version, revision, templateId]
              properties:
                version: { type: [string, 'null'] }
                revision: { type: [string, 'null'] }
                templateId: { type: [string, 'null'] }
    SubmodelSummaryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SubmodelSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SubmodelSearchPage:
      type: object
      additionalProperties: false
      required: [items, page, endpoint]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SubmodelSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
        endpoint:
          type: string
          enum: [registry, repository, workspace]
          description: Which service answered.
    SubmodelOwnersRequest:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ResourceKey' }
    SubmodelOwners:
      type: object
      additionalProperties: false
      required: [items, method, complete, scanned]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, shells]
            properties:
              key: { $ref: '#/components/schemas/ResourceKey' }
              shells:
                type: array
                items: { $ref: '#/components/schemas/ShellSummary' }
        method:
          type: string
          enum: [query, scan]
          description: '`query` asked the AAS repository with the AAS Query Language; `scan` read the shells'' references.'
        complete:
          type: boolean
          description: Every shell was considered; otherwise an empty list does not prove an orphan.
        scanned:
          type: [integer, 'null']
          description: The number of shells a scan read; `null` for a query.
    SubmodelCreateRequest:
      type: object
      additionalProperties: false
      required: [submodel]
      properties:
        submodel:
          type: object
          description: 'The new submodel: `{ source: empty, idShort, id?, metadata? }`, `{ source: template, templateId, id?, idShort?, metadata?, include?, values? }` or `{ source: json, submodel, id? }`.'
          required: [source]
          properties:
            source: { type: string, enum: [empty, template, json] }
          unevaluatedProperties: true
    SubmodelCreateResult:
      type: object
      additionalProperties: false
      required: [submodelKey, steps]
      properties:
        submodelKey: { $ref: '#/components/schemas/ResourceKey' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SyncStep' }
    ElementHit:
      type: object
      additionalProperties: false
      required: [shellKey, shellLabel, submodelKey, submodelLabel, elementKey, label, modelType, path]
      properties:
        shellKey:
          oneOf:
            - { $ref: '#/components/schemas/ResourceKey' }
            - { type: 'null' }
        shellLabel: { type: [string, 'null'] }
        submodelKey: { $ref: '#/components/schemas/ResourceKey' }
        submodelLabel: { type: string }
        elementKey: { $ref: '#/components/schemas/ResourceKey' }
        label: { type: string }
        modelType: { type: string }
        path: { type: string }
    ElementSearchResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ElementHit' }
    SubmodelRef:
      type: object
      additionalProperties: false
      required: [key, submodelId, idShort, semanticId, status]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        submodelId: { type: string }
        idShort: { type: [string, 'null'] }
        semanticId: { type: [string, 'null'] }
        administration:
          description: The submodel's version, revision and template ID (AAS 3.0 `templateId`), where it could be read and has any.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [version, revision, templateId]
              properties:
                version: { type: [string, 'null'] }
                revision: { type: [string, 'null'] }
                templateId: { type: [string, 'null'] }
        status:
          type: string
          enum: [available, forbidden, not_found, blocked, error]
          description: '`blocked`: the registry points to an endpoint outside the infrastructure, which Studio never contacts.'
    SubmodelRefList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SubmodelRef' }
    SubmodelDetail:
      type: object
      additionalProperties: false
      required: [key, submodel]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        submodel:
          allOf:
            - { $ref: '#/components/schemas/AasModelPayload' }
          description: The submodel as AAS JSON; without `submodelElements` for `content=metadata`.
    TreeNode:
      type: object
      additionalProperties: false
      required: [key, label, modelType, variableGroup, semanticId, preview, hasChildren, valueType]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        label:
          type: string
          description: idShort, `[index]` for list items, or the variable group name.
        modelType:
          type: string
          description: AAS modelType, or `OperationVariables` for a synthetic variable group.
        variableGroup:
          type: [string, 'null']
          enum: [input, output, inoutput, null]
        semanticId: { type: [string, 'null'] }
        preview: { type: [string, 'null'] }
        hasChildren: { type: boolean }
        valueType:
          type: [string, 'null']
          description: Value type of a Property or Range (`xs:double`, …).
        children:
          type: array
          description: Loaded children; absent with `hasChildren` when they follow on demand.
          items: { $ref: '#/components/schemas/TreeNode' }
    TreeNodeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TreeNode' }
    ElementDetail:
      type: object
      additionalProperties: false
      required: [key, path, value, revision, concurrency, ancestors]
      properties:
        structureRevision:
          type: [string, 'null']
          description: Revision of the element's children (idShorts, model types and order, not their values) that adding and moving are based on; `null` for elements without children.
        key: { $ref: '#/components/schemas/ResourceKey' }
        path:
          type: string
          description: Human-readable path, for example `Level1.Items[2]` or `Calibrate@input.Offset`.
        value:
          description: The element as AAS JSON, or the variables of an operation variable group.
        revision:
          type: [string, 'null']
          description: Opaque revision for writes, sent back as `If-Match`; `null` when the element cannot be written, for example an operation variable or a historic version.
        concurrency:
          type: [string, 'null']
          enum: [strong, best_effort, null]
          description: '`strong`: the source checks the revision atomically; `best_effort`: Studio compares against a fresh read just before writing (ADR 0013).'
        ancestors:
          type: array
          description: The elements above it, from the submodel's top level down, for opening its path in the tree.
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { $ref: '#/components/schemas/ResourceKey' }
              label: { type: string }
    ElementValueInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          description: A Property value (a string, or `null` to clear it) or all language strings of a MultiLanguageProperty.
          oneOf:
            - { type: [string, 'null'], maxLength: 1000000 }
            - type: array
              maxItems: 200
              items:
                type: object
                additionalProperties: false
                required: [language, text]
                properties:
                  language: { type: string, minLength: 1, maxLength: 64 }
                  text: { type: string, maxLength: 1000000 }
    SyncStep:
      type: object
      additionalProperties: false
      required: [resource, id, outcome]
      description: The outcome of one descriptor or asset-link write after an upload or delete (ADR 0020).
      properties:
        resource: { type: string, enum: [submodel, shell, submodelReference, shellDescriptor, submodelDescriptor, assetLinks] }
        id: { type: string, description: 'The resource''s identifier; for `submodelReference` steps of a submodel deletion, the shell whose reference was removed.' }
        outcome: { type: string, enum: [written, removed, failed, skipped] }
        detail: { type: string }
    UploadResult:
      type: object
      additionalProperties: false
      required: [shells, sync]
      properties:
        shells:
          type: array
          description: The shells the file added.
          items: { $ref: '#/components/schemas/ShellSummary' }
        sync:
          type: array
          description: Descriptors and asset links Studio wrote; empty where the server keeps them itself.
          items: { $ref: '#/components/schemas/SyncStep' }
    DeleteResult:
      type: object
      additionalProperties: false
      required: [sync]
      properties:
        sync:
          type: array
          description: Descriptor and asset links Studio removed; empty where the server keeps them itself.
          items: { $ref: '#/components/schemas/SyncStep' }
    InvocationInput:
      type: object
      additionalProperties: false
      required: [arguments]
      properties:
        arguments:
          type: array
          maxItems: 100
          description: Values of the input and in-out variables, as typed by the user.
          items:
            type: object
            additionalProperties: false
            required: [idShort, value]
            properties:
              idShort: { type: string, minLength: 1, maxLength: 128 }
              value: { type: [string, 'null'], maxLength: 100000 }
        async: { type: boolean, default: false }
    Invocation:
      type: object
      additionalProperties: false
      required: [handle, state, outputs, message]
      properties:
        handle:
          type: [string, 'null']
          description: Handle of an asynchronous invocation, to poll its state.
        state: { type: string, enum: [running, completed, failed] }
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [idShort, valueType, value]
            properties:
              idShort: { type: string }
              valueType: { type: [string, 'null'] }
              value: {}
        message: { type: [string, 'null'] }
    ConceptDescriptionSummary:
      type: object
      additionalProperties: false
      required: [id, idShort, preferredName, definition, dataType, unit]
      properties:
        id: { type: string }
        idShort: { type: [string, 'null'] }
        preferredName:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        definition:
          type: array
          items: { $ref: '#/components/schemas/LangString' }
        dataType: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
    ConceptDescriptionSummaryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConceptDescriptionSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ChangeEvent:
      type: object
      additionalProperties: false
      required: [id, time, action, entity, subject, subjectKey]
      properties:
        id: { type: string }
        time: { $ref: '#/components/schemas/Timestamp' }
        action: { type: string, enum: [created, updated, deleted] }
        entity: { type: string, enum: [aas, submodel, asset] }
        subject:
          type: string
          description: The AAS or submodel identifier.
        subjectKey:
          allOf:
            - { $ref: '#/components/schemas/ResourceKey' }
          description: The resource key of the subject, to link to it.
    ChangePage:
      type: object
      additionalProperties: false
      required: [items, lastEventId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChangeEvent' }
        lastEventId:
          type: [string, 'null']
          description: Pass as `after` to read newer events.
    AccessGrant:
      type: object
      additionalProperties: false
      required: [relation, subjectType, issuer, subject]
      properties:
        relation:
          type: string
          pattern: '^[a-z][\w-]{0,63}$'
          description: The share dialog offers `viewer`, `editor`, `executor`, and `owner`; the target defines which it accepts.
        subjectType: { type: string, enum: [user, group] }
        issuer: { type: string, minLength: 1, maxLength: 2000 }
        subject: { type: string, minLength: 1, maxLength: 500 }
    AccessGrantsInput:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AccessGrant' }
    AccessDocument:
      type: object
      additionalProperties: false
      required: [grants, revision, issuer]
      properties:
        grants:
          type: array
          items: { $ref: '#/components/schemas/AccessGrant' }
        revision:
          type: [string, 'null']
          description: Opaque revision; send it back as `If-Match` when replacing the grants.
        issuer:
          type: [string, 'null']
          description: Issuer of the signed-in user, for new grants.
    EffectiveRights:
      type: object
      additionalProperties: false
      required: [read, update, delete, execute, manage]
      properties:
        read: { type: boolean }
        update: { type: boolean }
        delete: { type: boolean }
        execute: { type: boolean }
        manage: { type: boolean }
    InvitationInput:
      type: object
      additionalProperties: false
      required: [relation]
      properties:
        relation: { type: string, pattern: '^[a-z][\w-]{0,63}$' }
        expiresInDays: { type: integer, minimum: 1, maximum: 90, default: 7 }
        maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
    InvitationResult:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 8, maxLength: 500, pattern: '^[\w.~-]+$' }
    RecentShell:
      oneOf:
        - type: object
          additionalProperties: false
          required: [key, title]
          properties:
            key: { $ref: '#/components/schemas/ResourceKey' }
            title:
              type: [string, 'null']
              maxLength: 500
              description: The title the shell had when it was opened.
        - allOf:
            - { $ref: '#/components/schemas/ResourceKey' }
          description: Older entries are a bare key; Studio stores them with a `null` title and returns objects only.
    Preferences:
      type: object
      additionalProperties: false
      description: Per-user settings stored by Studio. Every field has a default, so a client may send only what it knows.
      properties:
        recent:
          type: object
          description: Recently opened shells per target ID, newest first.
          propertyNames: { maxLength: 100 }
          additionalProperties:
            type: array
            maxItems: 50
            items: { $ref: '#/components/schemas/RecentShell' }
          default: {}
        valueLanguage:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})?$'
          default: en
          description: Preferred language of multi-language values.
        theme: { type: string, enum: [system, light, dark], default: system }
        autoRefresh: { type: boolean, default: true }
        refreshIntervalSeconds: { type: integer, minimum: 1, maximum: 300, default: 5 }
        syncOverrides:
          type: object
          description: Registry and discovery sync per infrastructure ID, honored only where the infrastructure lets users choose (`Target.registrySync.userOverride`, ADR 0020).
          propertyNames: { maxLength: 100 }
          additionalProperties: { $ref: '#/components/schemas/SyncMode' }
          default: {}
    AasModelPayload:
      type: object
      description: Authoritative AAS model JSON. The route implementation must bind this placeholder to schemas generated from the pinned AAS Core 3.1 model and validate it with AAS Core/package tooling; this draft deliberately does not recreate the metamodel.
      x-authoritative-schema: '@aas-core-works/aas-core3.1-typescript'
      unevaluatedProperties: true
    AasResourceType:
      type: string
      enum: [shell, submodel, submodelElement, conceptDescription]
    AasResourceSummary:
      type: object
      additionalProperties: false
      required: [key, resourceType, identifier, revision, permissions]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        resourceType: { $ref: '#/components/schemas/AasResourceType' }
        identifier: { type: string, minLength: 1, maxLength: 4096 }
        idShort: { type: string, maxLength: 128 }
        displayName: { type: string, maxLength: 500 }
        semanticIds:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 4096 }
        revision: { $ref: '#/components/schemas/Revision' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
    AasResource:
      type: object
      additionalProperties: false
      required: [summary, model, validation]
      properties:
        summary: { $ref: '#/components/schemas/AasResourceSummary' }
        model: { $ref: '#/components/schemas/AasModelPayload' }
        validation: { $ref: '#/components/schemas/ValidationResult' }
    AasResourcePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AasResourceSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AasResourceWrite:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { $ref: '#/components/schemas/AasModelPayload' }
    SubmodelElementWrite:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        parentElementKey: { $ref: '#/components/schemas/ResourceKey' }
        model: { $ref: '#/components/schemas/AasModelPayload' }
    AasOperationInvocationRequest:
      type: object
      additionalProperties: false
      required: [operationKey, inputs, confirmation]
      properties:
        operationKey: { $ref: '#/components/schemas/ResourceKey' }
        inputs:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AasModelPayload' }
        inoutput:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AasModelPayload' }
        confirmation:
          type: boolean
          description: Explicit UI confirmation for an operation declared safety-relevant by the target/policy.
    AasOperationInvocationResult:
      type: object
      additionalProperties: false
      required: [outputs]
      properties:
        outputs:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AasModelPayload' }
        inoutput:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AasModelPayload' }
        diagnostics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Diagnostic' }
    FileMetadata:
      type: object
      additionalProperties: false
      required: [key, name, mediaType, size, revision]
      properties:
        key: { $ref: '#/components/schemas/ResourceKey' }
        name: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, maxLength: 200 }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        revision: { $ref: '#/components/schemas/Revision' }
        referencedBy:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ResourceKey' }
    FileMetadataPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileMetadata' }
        page: { $ref: '#/components/schemas/PageInfo' }
    FileUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary }
        name: { type: string, maxLength: 255 }
        parentResourceKey: { $ref: '#/components/schemas/ResourceKey' }
    SemanticMatch:
      type: object
      additionalProperties: false
      required: [resource, match]
      properties:
        resource: { $ref: '#/components/schemas/AasResourceSummary' }
        match:
          type: string
          enum: [exact, version_compatible, partial]
        matchedSemanticIds:
          type: array
          items: { type: string, maxLength: 4096 }
        reasons:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 500 }
    SemanticMatchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SemanticMatch' }
        page: { $ref: '#/components/schemas/PageInfo' }
    NativeHandle:
      type: string
      minLength: 16
      maxLength: 1000
      pattern: '^[A-Za-z0-9._:-]+$'
      writeOnly: true
      description: Short-lived opaque handle issued by the constrained Electron native broker. It is not a path and cannot be chosen by ordinary browser code.
    WorkspaceMetadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        author: { type: string, maxLength: 500 }
        templateId: { type: string, maxLength: 200 }
        metamodelVersion: { type: string, maxLength: 100 }
        projectFormatVersion:
          type: string
          maxLength: 100
          description: Internal versioned project format; the prototype directory shape is not a public compatibility promise.
    WorkspaceMetadataUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        author: { type: string, maxLength: 500 }
        templateId: { type: string, maxLength: 200 }
    WorkspaceState:
      type: string
      enum: [closed, opening, ready, unsaved, recovering, invalid, unavailable]
    RecoveryState:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: { type: boolean }
        snapshotRevision: { $ref: '#/components/schemas/Revision' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        message: { type: string, maxLength: 1000 }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, targetId, metadata, state, revision, validation, recovery, saved]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        targetId: { $ref: '#/components/schemas/TargetId' }
        metadata: { $ref: '#/components/schemas/WorkspaceMetadata' }
        state: { $ref: '#/components/schemas/WorkspaceState' }
        revision: { $ref: '#/components/schemas/Revision' }
        persistedPackageRevision: { $ref: '#/components/schemas/Revision' }
        validation: { $ref: '#/components/schemas/ValidationResult' }
        recovery: { $ref: '#/components/schemas/RecoveryState' }
        saved: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }
        page: { $ref: '#/components/schemas/PageInfo' }
    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [destinationHandle, metadata]
      properties:
        destinationHandle: { $ref: '#/components/schemas/NativeHandle' }
        metadata: { $ref: '#/components/schemas/WorkspaceMetadata' }
        initialShell:
          oneOf:
            - $ref: '#/components/schemas/AasModelPayload'
            - type: 'null'
    WorkspaceImportRequest:
      type: object
      additionalProperties: false
      required: [sourceHandle]
      properties:
        sourceHandle: { $ref: '#/components/schemas/NativeHandle' }
        destinationHandle: { $ref: '#/components/schemas/NativeHandle' }
        metadataOverrides: { $ref: '#/components/schemas/WorkspaceMetadataUpdate' }
    WorkspaceDuplicateRequest:
      type: object
      additionalProperties: false
      required: [destinationHandle, name]
      properties:
        destinationHandle: { $ref: '#/components/schemas/NativeHandle' }
        name: { type: string, minLength: 1, maxLength: 200 }
    WorkspaceSaveRequest:
      type: object
      additionalProperties: false
      properties:
        validateBeforeSave: { type: boolean, default: true }
    WorkspaceExportRequest:
      type: object
      additionalProperties: false
      required: [destinationHandle]
      properties:
        destinationHandle: { $ref: '#/components/schemas/NativeHandle' }
        representation:
          type: string
          enum: [preserve, json, xml]
          default: preserve
    WorkspaceSaveResult:
      type: object
      additionalProperties: false
      required: [workspaceId, revision, savedAt, validation]
      properties:
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        revision: { $ref: '#/components/schemas/Revision' }
        savedAt: { $ref: '#/components/schemas/Timestamp' }
        artifactName: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        validation: { $ref: '#/components/schemas/ValidationResult' }
    CopyResourceType:
      type: string
      enum: [shell, submodel, conceptDescription]
    CopyDependencySelection:
      type: object
      additionalProperties: false
      properties:
        submodels: { type: string, enum: [none, referenced], default: referenced }
        conceptDescriptions: { type: string, enum: [none, referenced], default: referenced }
        supplementaryFiles: { type: string, enum: [none, referenced], default: referenced }
    CopySource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, targetId, resources]
          properties:
            kind: { type: string, const: target }
            targetId: { $ref: '#/components/schemas/TargetId' }
            resources:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [type, key]
                properties:
                  type: { $ref: '#/components/schemas/CopyResourceType' }
                  key: { $ref: '#/components/schemas/ResourceKey' }
        - type: object
          additionalProperties: false
          required: [kind, format, content]
          properties:
            kind: { type: string, const: text }
            format: { type: string, enum: [json, xml] }
            content: { type: string, maxLength: 20000000 }
    CopyPlanRequest:
      type: object
      additionalProperties: false
      required: [source, destinationTargetId]
      properties:
        source: { $ref: '#/components/schemas/CopySource' }
        destinationTargetId: { $ref: '#/components/schemas/TargetId' }
        destinationShellKey:
          $ref: '#/components/schemas/ResourceKey'
          description: A copied submodel is also referenced from this shell of the destination.
        dependencies: { $ref: '#/components/schemas/CopyDependencySelection' }
    CollisionPolicy:
      type: string
      enum: [fail_without_changes, skip_existing, replace, new_identifiers]
      description: '`fail_without_changes` writes nothing if an identifier exists. `replace` needs structural writes and is not offered within one target. `new_identifiers` gives copied shells and submodels new identifiers and rewrites the references inside the copied set; concept descriptions keep theirs.'
    CopyResourcePlan:
      type: object
      additionalProperties: false
      required: [key, resourceType, identifier, label, role, shellIdentifier, exists, blocked, files, findings]
      properties:
        key: { type: string, maxLength: 100, description: Opaque within the plan, for `exclude`. }
        resourceType: { $ref: '#/components/schemas/CopyResourceType' }
        identifier: { type: string, minLength: 1, maxLength: 4096 }
        label: { type: string }
        role: { type: string, enum: [root, dependency] }
        shellIdentifier: { type: [string, 'null'] }
        exists: { type: boolean }
        blocked: { type: [string, 'null'], description: Why the resource is left out, e.g. unreadable or with findings. }
        files: { type: integer, minimum: 0 }
        findings:
          type: array
          maxItems: 20
          items: { type: string }
    CopyTargetFacts:
      type: object
      additionalProperties: false
      description: What the copy may do at a target (DATA-013); the target still checks every write.
      required: [targetId, name, kind, identity, createResources, replaceResources, conceptDescriptions, files]
      properties:
        targetId: { oneOf: [{ $ref: '#/components/schemas/TargetId' }, { type: 'null' }] }
        name: { type: string }
        kind: { type: string, enum: [live, workspace, text] }
        identity:
          type: string
          enum: [user, studio, none]
          description: Whose rights the target checks, the signed-in user's, Studio's service account's, or none.
        createResources: { type: boolean }
        replaceResources: { type: boolean }
        conceptDescriptions: { type: boolean }
        files: { type: boolean, description: The target keeps files and the deployment allows uploads. }
    CopyPlan:
      type: object
      additionalProperties: false
      required: [id, source, destination, sourceTargetId, sourceLabel, destinationTargetId, destinationShellKey, sameTarget, resources, allowedCollisionPolicies, defaultCollisionPolicy, notes, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/CopyPlanId' }
        source: { $ref: '#/components/schemas/CopyTargetFacts' }
        destination: { $ref: '#/components/schemas/CopyTargetFacts' }
        sourceTargetId: { oneOf: [{ $ref: '#/components/schemas/TargetId' }, { type: 'null' }] }
        sourceLabel: { type: string }
        destinationTargetId: { $ref: '#/components/schemas/TargetId' }
        destinationShellKey: { oneOf: [{ $ref: '#/components/schemas/ResourceKey' }, { type: 'null' }] }
        sameTarget: { type: boolean }
        resources:
          type: array
          items: { $ref: '#/components/schemas/CopyResourcePlan' }
        allowedCollisionPolicies:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/CollisionPolicy' }
        defaultCollisionPolicy: { $ref: '#/components/schemas/CollisionPolicy' }
        notes:
          type: array
          items: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    CopyExecutionRequest:
      type: object
      additionalProperties: false
      required: [collisionPolicy, confirmed]
      properties:
        collisionPolicy: { $ref: '#/components/schemas/CollisionPolicy' }
        confirmed:
          type: boolean
          const: true
          description: Confirms the visible source, destination, dependencies, collisions, policy, and non-atomic partial-success semantics.
        exclude:
          type: array
          maxItems: 10000
          items: { type: string, maxLength: 100 }
          description: Keys of plan resources the user deselected.
    CopyOutcomeStatus:
      type: string
      enum: [created, replaced, skipped, failed]
    CopyResourceOutcome:
      type: object
      additionalProperties: false
      required: [resourceType, identifier, destinationIdentifier, status, message]
      properties:
        resourceType: { $ref: '#/components/schemas/CopyResourceType' }
        identifier: { type: string, minLength: 1, maxLength: 4096 }
        destinationIdentifier: { type: string, minLength: 1, maxLength: 4096 }
        status: { $ref: '#/components/schemas/CopyOutcomeStatus' }
        message: { type: [string, 'null'] }
    CopyReportStatus:
      type: string
      enum: [succeeded, partial_success, failed]
    CopyReportCounts:
      type: object
      additionalProperties: false
      required: [planned, created, skipped, replaced, failed]
      properties:
        planned: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        replaced: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    CopyReport:
      type: object
      additionalProperties: false
      required: [planId, status, collisionPolicy, sourceUnchanged, atomic, counts, outcomes, sync, shellKey, submodelKey]
      properties:
        planId: { $ref: '#/components/schemas/CopyPlanId' }
        status: { $ref: '#/components/schemas/CopyReportStatus' }
        collisionPolicy: { $ref: '#/components/schemas/CollisionPolicy' }
        sourceUnchanged: { type: boolean, const: true }
        atomic: { type: boolean, const: false }
        counts: { $ref: '#/components/schemas/CopyReportCounts' }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/CopyResourceOutcome' }
        sync:
          type: array
          items: { $ref: '#/components/schemas/SyncStep' }
        shellKey: { oneOf: [{ $ref: '#/components/schemas/ResourceKey' }, { type: 'null' }] }
        submodelKey: { oneOf: [{ $ref: '#/components/schemas/ResourceKey' }, { type: 'null' }] }
    PrincipalType:
      type: string
      enum: [user, group]
    AccessLevel:
      type: string
      enum: [view, author, administer]
    AccessRule:
      type: object
      additionalProperties: false
      required: [principalType, principalId, access]
      properties:
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        principalId: { type: string, minLength: 1, maxLength: 500 }
        access:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/AccessLevel' }
    AccessRuleSet:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/AccessRule' }
        publicWithinDeployment: { type: boolean, default: false }
        revision: { $ref: '#/components/schemas/Revision' }
    ViewSchemaVersion:
      type: string
      const: '1-draft'
      description: Bootstrap schema version. It remains explicitly unstable until a real builder/renderer vertical slice proves the contract.
    LayoutItem:
      type: object
      additionalProperties: false
      required: [widgetId, x, y, width, height]
      properties:
        widgetId: { type: string, minLength: 1, maxLength: 200 }
        x: { type: integer, minimum: 0, maximum: 255 }
        y: { type: integer, minimum: 0, maximum: 100000 }
        width: { type: integer, minimum: 1, maximum: 256 }
        height: { type: integer, minimum: 1, maximum: 10000 }
        minWidth: { type: integer, minimum: 1, maximum: 256 }
        minHeight: { type: integer, minimum: 1, maximum: 10000 }
        breakpoint:
          type: string
          enum: [xs, sm, md, lg, xl]
    ResponsiveGridLayout:
      type: object
      additionalProperties: false
      required: [type, columns, items]
      properties:
        type: { type: string, const: responsive_grid }
        columns: { type: integer, minimum: 1, maximum: 256 }
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/LayoutItem' }
    BindingDirection:
      type: string
      enum: [read, write, invoke, observe]
    BindingCardinality:
      type: string
      enum: [one, optional, many]
    ViewContextKind:
      type: string
      enum: [selected_shell, selected_submodel, selected_element]
    InstanceBinding:
      type: object
      additionalProperties: false
      required: [kind, direction, targetId, resourceKey]
      properties:
        kind: { type: string, const: instance }
        direction: { $ref: '#/components/schemas/BindingDirection' }
        targetId: { $ref: '#/components/schemas/TargetId' }
        resourceKey: { $ref: '#/components/schemas/ResourceKey' }
        expectedModelType: { type: string, maxLength: 200 }
        expectedValueType: { type: string, maxLength: 200 }
        cardinality: { $ref: '#/components/schemas/BindingCardinality' }
    SemanticBinding:
      type: object
      additionalProperties: false
      required: [kind, direction, context, semanticIds, cardinality]
      properties:
        kind: { type: string, const: semantic }
        direction: { $ref: '#/components/schemas/BindingDirection' }
        context: { $ref: '#/components/schemas/ViewContextKind' }
        semanticIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, maxLength: 4096 }
        path:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 500 }
        expectedModelType: { type: string, maxLength: 200 }
        expectedValueType: { type: string, maxLength: 200 }
        qualifiers:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type: { type: string, maxLength: 500 }
              value: { type: string, maxLength: 2000 }
        cardinality: { $ref: '#/components/schemas/BindingCardinality' }
    BindingDescriptor:
      oneOf:
        - $ref: '#/components/schemas/InstanceBinding'
        - $ref: '#/components/schemas/SemanticBinding'
      discriminator:
        propertyName: kind
        mapping:
          instance: '#/components/schemas/InstanceBinding'
          semantic: '#/components/schemas/SemanticBinding'
    WidgetInstance:
      type: object
      additionalProperties: false
      required: [id, type, configuration, bindings]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        type:
          type: string
          minLength: 3
          maxLength: 300
          pattern: '^[A-Za-z0-9._:-]+$'
        configuration:
          type: object
          maxProperties: 1000
          description: Untrusted JSON validated against the owning widget type's JSON Schema. Unknown app configuration is preserved across safe migrations.
          unevaluatedProperties: true
        bindings:
          type: object
          maxProperties: 100
          propertyNames: { pattern: '^[A-Za-z][A-Za-z0-9_-]*$' }
          additionalProperties: { $ref: '#/components/schemas/BindingDescriptor' }
    ViewPresentation:
      type: object
      additionalProperties: false
      properties:
        theme: { type: string, enum: [inherit, light, dark] }
        description: { type: string, maxLength: 5000 }
    ViewDefinition:
      type: object
      additionalProperties: false
      x-stability: experimental
      x-validation: JSON Schema 2020-12 with Ajv before persistence and rendering
      description: Declarative data only. It cannot contain JavaScript, Vue templates, HTML, credentials, service URLs, native paths, or serialized AAS values.
      required: [schemaVersion, title, layout, widgets]
      properties:
        schemaVersion: { $ref: '#/components/schemas/ViewSchemaVersion' }
        title: { type: string, minLength: 1, maxLength: 300 }
        layout: { $ref: '#/components/schemas/ResponsiveGridLayout' }
        widgets:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/WidgetInstance' }
        presentation: { $ref: '#/components/schemas/ViewPresentation' }
    ViewOwner:
      type: object
      additionalProperties: false
      required: [type, id, displayName]
      properties:
        type: { $ref: '#/components/schemas/PrincipalType' }
        id: { type: string, maxLength: 500 }
        displayName: { type: string, maxLength: 300 }
    View:
      type: object
      additionalProperties: false
      required: [id, revision, definition, owner, permissions, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ViewId' }
        revision: { $ref: '#/components/schemas/Revision' }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        owner: { $ref: '#/components/schemas/ViewOwner' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
        accessRules: { $ref: '#/components/schemas/AccessRuleSet' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ViewSummary:
      type: object
      additionalProperties: false
      required: [id, title, revision, owner, permissions, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ViewId' }
        title: { type: string, maxLength: 300 }
        revision: { $ref: '#/components/schemas/Revision' }
        owner: { $ref: '#/components/schemas/ViewOwner' }
        permissions: { $ref: '#/components/schemas/PermissionSet' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ViewPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ViewSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ViewCreateRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        accessRules: { $ref: '#/components/schemas/AccessRuleSet' }
    ViewUpdateRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: { $ref: '#/components/schemas/ViewDefinition' }
    ViewContext:
      type: object
      additionalProperties: false
      required: [targetId, contextKind, contextResourceKey, mode]
      properties:
        targetId: { $ref: '#/components/schemas/TargetId' }
        contextKind: { $ref: '#/components/schemas/ViewContextKind' }
        contextResourceKey: { $ref: '#/components/schemas/ResourceKey' }
        mode: { type: string, enum: [authoring_preview, runtime] }
    ViewValidationRequest:
