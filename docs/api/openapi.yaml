openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: BaSyx Studio Frontend API
  version: 1.0.0-draft.1
  summary: Versioned contract between the BaSyx Studio UI and the Studio Service BFF
  description: |
    This is the first contract draft for communication between the core Nuxt/Vue
    frontend and the trusted Studio Service. It applies unchanged to hosted web and
    Electron deployments.

    The API is target-oriented. Clients send opaque Studio target and resource keys;
    they never send downstream service URLs or receive OAuth tokens, client secrets,
    database credentials, native file paths, or unrestricted filesystem handles.
    Live AAS operations are implemented by the BFF through `basyx-typescript-sdk`;
    local AASX operations use the desktop Workspace Worker behind the same contract.

    AAS payload schemas intentionally remain generic here. Their authoritative
    structure and validation come from the generated AAS Core 3.1 model and package
    validators, not from a second Studio-maintained metamodel schema.

    Queries and commands use HTTP. One-way progress, invalidation, and notification
    events use Server-Sent Events with bounded polling through the operations API as
    fallback. This contract does not define a generic downstream proxy or WebSocket
    command protocol.
  license:
    name: MIT
    identifier: MIT
  x-status: first-draft
  x-contract-role: bootstrap-design-source
  x-generation-guardrail: Replace this bootstrap file with output from the authoritative Studio route/contract source once implementation begins; do not maintain duplicate DTO definitions.
  x-design-constraints: [ARCH-001, ARCH-002, ARCH-003, ARCH-004, ARCH-005, ARCH-006, ARCH-007, ARCH-008, ARCH-009, OPS-001, OPS-003, OPS-004, OPS-005, OPS-006, OPS-008]
  x-adjacent-contracts:
    electronIpc: Native dialogs, approved handles, update control, and launch-secret injection are a separate validated Electron bridge contract.
    appRpc: Sandboxed app and widget calls use the separate versioned Studio SDK postMessage/capability RPC contract.
    workspaceWorker: Package parsing and serialization use an internal versioned local worker contract.
    marketplace: Publisher, build, signing, catalogue storage, and OCI distribution are independent marketplace service contracts.
    downstreamAas: BaSyx repository, registry, discovery, file server, and orchestration APIs are BFF implementation details accessed through basyx-typescript-sdk; BaSyx Go endpoints outside the AAS API (upload, serialization, history, event feed, ReBAC) use a separate BFF client (ADR 0022).
  x-requirement-sources:
    - ../requirements.md
    - ../architecture/overview.md
    - ../architecture/deployment-variants.md
    - ../architecture/mechanisms.md
    - ../architecture/data-and-workspaces.md
    - ../architecture/views-and-dashboards.md
    - ../architecture/app-platform.md
    - ../architecture/security.md
    - ../architecture/observability.md
    - ../architecture/technology-stack.md
    - ../adr/0001-runtime-and-service-boundaries.md
    - ../adr/0002-bff-and-authentication.md
    - ../adr/0003-aas-targets-and-workspaces.md
    - ../adr/0004-runtime-installable-apps.md
    - ../adr/0005-storage-and-observability.md
    - ../adr/0006-frontend-state-and-validation.md
    - ../adr/0007-http-and-realtime-transports.md
    - ../adr/0008-evolutionary-architecture-and-dependencies.md
    - ../adr/0009-declarative-graphical-views.md
servers:
  - url: /api/studio/v1
    description: Same-origin hosted API or authenticated Electron loopback API
security:
  - studioSession: []
tags:
  - name: Context
  - name: Authentication
  - name: Targets
  - name: Infrastructures
  - name: AAS
  - name: Preferences
  - name: Workspaces
  - name: Copies
  - name: Views
  - name: Apps
  - name: Operations
  - name: Audit

paths:
  /context:
    get:
      tags: [Context]
      operationId: getStudioContext
      summary: Get deployment, user, and feature context needed to bootstrap the UI
      security: []
      x-requirements: [PROD-003, DATA-003, DATA-016, DEP-001, DEP-003, DEP-004]
      responses:
        '200':
          description: Current context
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioContext' }
        default: { $ref: '#/components/responses/Problem' }

  /session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current opaque Studio session
      x-requirements: [SEC-001, SEC-002, SEC-004, DATA-011]
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: startLogin
      summary: Start generic OIDC authorization-code login with PKCE
      security: []
      x-requirements: [SEC-001, SEC-002, SEC-004]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authorization navigation instruction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationInstruction' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/callback:
    get:
      tags: [Authentication]
      operationId: finishLogin
      summary: Receive a Studio-login or target-specific OIDC authorization callback
      description: The BFF maps the opaque state to the exact Studio or target authorization attempt, validates state and nonce, exchanges the code using its PKCE verifier, stores tokens server-side in the correct isolated context, and sets or resumes the secure HttpOnly Studio session.
      security: []
      x-requirements: [SEC-001, SEC-002, SEC-004]
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '303':
          description: Redirect to the validated post-login UI location
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Set-Cookie:
              description: Secure, HttpOnly, SameSite Studio session cookie
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the Studio session and revoke server-side target sessions where applicable
      x-requirements: [SEC-001, DATA-011]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session ended }
        default: { $ref: '#/components/responses/Problem' }

  /me/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Get the signed-in user's preferences
      description: Stored by Studio per user. Recently opened shells are kept per target, so a target never shows another target's shells.
      x-requirements: [PROD-001, DATA-020]
      responses:
        '200':
          description: Preferences, with defaults for unset fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Preferences]
      operationId: replacePreferences
      summary: Replace the signed-in user's preferences
      description: Invalid preferences are refused with `invalid_request` and `violations`. Older clients may send recently opened shells as bare keys; they are stored with a `null` title.
      x-requirements: [PROD-001, DATA-020]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Problem' }

  /targets:
    get:
      tags: [Targets]
      operationId: listTargets
      summary: List all infrastructures and local workspaces visible to the current user
      description: Open AASX workspaces come first, then the live infrastructures. The list is not paged.
      x-requirements: [DATA-002, DATA-003, DATA-011, UX-001, UX-004]
      responses:
        '200':
          description: Targets with their capabilities and independent authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetList' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}:
    get:
      tags: [Targets]
      operationId: getTarget
      summary: Get sanitized target capabilities, permissions, and status
      description: Capabilities are derived from the service profiles stored at the last probe, the template, the target kind, and the security mode (ADR 0021); feature code branches on them, never on the target kind.
      x-requirements: [DATA-002, DATA-003, DATA-016]
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: Target context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/activation:
    put:
      tags: [Targets]
      operationId: activateTarget
      summary: Verify and set the active target for the current Studio session
      x-requirements: [DATA-002, DATA-003, DATA-011, UX-001, UX-005]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateTargetRequest' }
      responses:
        '200':
          description: Verified active target context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveTargetContext' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/authorization:
    post:
      tags: [Authentication, Targets]
      operationId: startTargetAuthorization
      summary: Start or resume authentication for exactly one target
      x-requirements: [DATA-002, DATA-011, SEC-001, SEC-002, SEC-004]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetAuthorizationRequest' }
      responses:
        '200':
          description: Authorization navigation instruction or already-connected result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationInstruction' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authentication, Targets]
      operationId: disconnectTarget
      summary: Remove only this target's delegated credential context
      x-requirements: [DATA-002, DATA-011]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Target session disconnected }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures:
    get:
      tags: [Infrastructures]
      operationId: listInfrastructures
      summary: List Studio-managed live infrastructure configurations
      description: Administrators only. The list is not paged.
      x-requirements: [DATA-002, SEC-006]
      responses:
        '200':
          description: Sanitized infrastructure configurations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfrastructureList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Infrastructures]
      operationId: createInfrastructure
      summary: Validate, probe, and register a live AAS infrastructure
      description: |
        Administrators only. Endpoint URLs are accepted only in this authorized
        administration flow and must fit the template (ADR 0020). Every endpoint
        is probed at `/description`; an unreachable endpoint fails the request
        with `infrastructure_unreachable`, and the profiles reported are stored
        with the infrastructure (ADR 0021). Client secrets are deployment secret
        references (`env:`, `file:`) in hosted Studio and are stored encrypted on
        the desktop; they are never returned.
      x-requirements: [DEP-001, DEP-003, DATA-002, SEC-003, SEC-004, SEC-007, SEC-008]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InfrastructureInput' }
      responses:
        '201':
          description: Infrastructure registered and available as a target
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Infrastructure' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures/export:
    get:
      tags: [Infrastructures]
      operationId: exportInfrastructures
      summary: Export infrastructures in the file format (YAML)
      description: |
        Administrators only. All infrastructures, or those named by `ids`, in
        the format of `STUDIO_INFRASTRUCTURES_FILE` (ADR 0037). References to
        deployment secrets are kept; secrets and certificates stored in Studio
        are left out and replaced by a comment.
      x-requirements: [DATA-002, SEC-004]
      parameters:
        - name: ids
          in: query
          description: Comma-separated infrastructure IDs; all when omitted.
          schema: { type: string }
        - name: download
          in: query
          description: Present to answer with `Content-Disposition attachment`.
          allowEmptyValue: true
          schema: { type: string }
      responses:
        '200':
          description: The infrastructures as YAML
          content:
            application/yaml:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures/import:
    post:
      tags: [Infrastructures]
      operationId: importInfrastructures
      summary: Check or import infrastructures given in the file format
      description: |
        Administrators only, unless the deployment fixes its infrastructures.
        `dryRun` checks every entry against the API rules and this deployment
        and reports name conflicts; otherwise each entry is created, or
        replaces the infrastructure with its name, one by one, probing its
        endpoints as a save in the form does (ADR 0037).
      x-requirements: [DATA-002, SEC-004, SEC-008]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string, maxLength: 1000000 }
                dryRun: { type: boolean, default: true }
                resolutions:
                  type: object
                  description: Per entry index, what to do with a name conflict.
                  additionalProperties: { type: string, enum: [skip, replace, create] }
      responses:
        '200':
          description: Problems of the file, and each entry with its problems, conflict, resolution and outcome
          content:
            application/json:
              schema:
                type: object
                required: [problems, entries]
                properties:
                  problems: { type: array, items: { type: string } }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [index, key, name, problems, conflict, resolution, outcome, infrastructureId]
                      properties:
                        index: { type: integer }
                        key: { type: [string, 'null'] }
                        name: { type: [string, 'null'] }
                        problems: { type: array, items: { type: string } }
                        conflict:
                          type: [object, 'null']
                          properties:
                            id: { type: string }
                            name: { type: string }
                            managed: { type: boolean }
                        resolution: { type: string, enum: [skip, replace, create] }
                        outcome: { type: [string, 'null'], enum: [created, replaced, skipped, failed, null] }
                        infrastructureId: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures/{infrastructureId}:
    parameters:
      - $ref: '#/components/parameters/InfrastructureId'
    get:
      tags: [Infrastructures]
      operationId: getInfrastructure
      summary: Get one sanitized infrastructure configuration
      x-requirements: [DATA-002, SEC-006]
      responses:
        '200':
          description: Infrastructure
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Infrastructure' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Infrastructures]
      operationId: updateInfrastructure
      summary: Validate, probe, and replace an infrastructure configuration
      description: |
        Replaces the whole configuration, probes it again and stores the new
        profiles. `If-Match` carries the revision that was read as `"<revision>"`;
        without it the request fails with `invalid_request`, with a stale one
        with `revision_conflict`. Omit `security.clientSecret` to keep the stored
        secret; omit `clientCertificate` to keep the stored client certificate,
        or send `null` to remove it.
      x-requirements: [DATA-002, SEC-003, SEC-007, SEC-008]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InfrastructureInput' }
      responses:
        '200':
          description: Updated infrastructure
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Infrastructure' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Infrastructures]
      operationId: deleteInfrastructure
      summary: Remove an infrastructure configuration without changing its AAS data
      x-requirements: [DATA-002, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Configuration removed }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures/{infrastructureId}/probe:
    post:
      tags: [Infrastructures]
      operationId: probeInfrastructure
      summary: Probe every endpoint again and store the service profiles it reports
      description: Reads `/description` of each endpoint. The profiles replace the stored ones, so capabilities follow what the services announce now (ADR 0021). Unreachable endpoints are reported, not refused.
      x-requirements: [DATA-002, SEC-008]
      parameters:
        - $ref: '#/components/parameters/InfrastructureId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Probe result per endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfrastructureProbeResult' }
        default: { $ref: '#/components/responses/Problem' }

  /infrastructures/{infrastructureId}/connections/{connectionKey}/test:
    post:
      tags: [Infrastructures]
      operationId: testInfrastructureConnection
      summary: Test a connection to a third-party service without revealing its secret
      description: |
        Obtains the connection's credentials (a token from the issuer for
        `oauth2ClientCredentials` and `delegatedUser`, as the signed-in
        administrator) and runs the type's checks, e.g. for `influxdb2`
        `GET /health` and a read-only query (ADR 0040). With `connection` in
        the body, the edited connection is tested; an omitted secret is the
        one stored for the same key and scheme. Every test is audited.
      x-requirements: [CON-005, CON-006]
      parameters:
        - $ref: '#/components/parameters/InfrastructureId'
        - name: connectionKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection: { $ref: '#/components/schemas/ConnectionInput' }
      responses:
        '200':
          description: The checks with their outcome; never the secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells:
    get:
      tags: [AAS]
      operationId: listShells
      summary: List shell summaries on one target
      description: |
        Reads the list source of the infrastructure (ADR 0020): AAS descriptors
        from the AAS registry or shells from the AAS repository, cursor-paged
        by the service. Registry entries may point to shells that cannot be
        opened; `shell-availability` tells which.
      x-requirements: [PROD-001, PROD-002, PROD-005, DATA-001, DATA-003, DATA-016, DATA-017]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Shell page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellSummaryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AAS]
      operationId: createShell
      summary: Create and validate an Asset Administration Shell
      x-requirements: [PROD-001, PROD-004, DATA-001, DATA-007, DATA-016]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '201': { $ref: '#/components/responses/AasResourceCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shell-availability:
    post:
      tags: [AAS]
      operationId: getShellAvailability
      summary: Tell whether listed shells can be opened
      description: |
        The UI asks for the rows in view (the Web UI's online/offline marker).
        `blocked` means the registry points to an endpoint outside the
        infrastructure, which Studio never contacts (`descriptor_endpoint_blocked`,
        ADR 0020). A POST because the keys can be long; nothing is changed.
      x-requirements: [PROD-001, DATA-017, SEC-008]
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShellAvailabilityRequest' }
      responses:
        '200':
          description: Status per requested key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellAvailability' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/searches:
    post:
      tags: [AAS]
      operationId: searchTarget
      summary: Search shells or submodels by expression or AAS query, or submodel elements by text
      description: |
        Shells (`scope: shells`) are searched with the search field's
        `expression` (free text plus `field:value`, `field=value`,
        `field!=value`, `-field:value` and quoted values over `id`, `idShort`,
        `assetKind`, `assetType`, `globalAssetId`, `specificAssetId`) or a raw
        AAS Query Language `query` from the advanced dialog. Live targets run
        both as queries on the service named by the `queryTarget` capability
        (ADR 0024); an empty expression lists the shells. A raw query is
        checked first: at most 64 KiB, valid against the IDTA-01002-3 schema,
        no `$select`, and only the roots of the queried service (`$aas` on the
        repository, `$aasdesc` and `$smdesc` on the registry); otherwise
        `query_invalid` with `violations`. AASX workspaces evaluate expressions
        themselves and refuse raw queries. Without query support the request
        fails with `query_unsupported` and the UI filters the loaded rows.

        Submodels (`scope: submodels`, the submodel view) are searched the same
        way over `id`, `idShort` and `semanticId`; queries run on the submodel
        repository (the `submodelSearch` capability), raw queries use the roots
        `$sm` and `$sme`. The AAS Query Language has no field for the kind.

        Elements (`scope: elements`, the palette) are searched by idShort text,
        case-insensitive, where the `elementSearch` capability is set; the
        result is not paged. A POST because queries are JSON; nothing is changed.
      x-requirements: [PROD-001, DATA-001, DATA-003, DATA-019]
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Matching shells or submodels (cursor-paged), or elements
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ShellSearchPage' }
                  - { $ref: '#/components/schemas/SubmodelSearchPage' }
                  - { $ref: '#/components/schemas/ElementSearchResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodel-owners:
    post:
      tags: [AAS]
      operationId: getSubmodelOwners
      summary: Find the shells that reference listed submodels
      description: |
        The submodel list asks for its rows in view to mark orphans. Where the
        AAS repository announces the AAS Query Language, one query on
        `$aas#submodels[].keys[].value` answers (`method: query`); otherwise
        Studio reads the shells' references, at most 1,000 shells
        (`method: scan`, `scanned`). Without `complete`, shells beyond those
        read may still reference a submodel, so an empty list does not prove
        an orphan. A POST because the keys can be long; nothing is changed.
      x-requirements: [PROD-001, DATA-001]
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmodelOwnersRequest' }
      responses:
        '200':
          description: The referencing shells per requested key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelOwners' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/lookup:
    get:
      tags: [AAS]
      operationId: lookupShellsByAssetId
      summary: Find the shells of an asset by its asset ID
      description: Looks the global asset ID up in the AAS discovery where the infrastructure has one; without discovery or without a match, queries the AAS repository where it announces queries, otherwise returns no shells. At most 20 shells. Backs `?globalAssetId=` deep links and the palette's asset-ID lookup.
      x-requirements: [PROD-001, DATA-001, DATA-017]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - name: assetId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Shells of the asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellSummaryList' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/ShellKey'
    get:
      tags: [AAS]
      operationId: getShell
      summary: Read one shell
      x-requirements: [PROD-001, PROD-002, PROD-005, DATA-001, DATA-009]
      responses:
        '200':
          description: The shell as AAS JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellDetail' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceShell
      summary: Replace and validate one shell using optimistic concurrency
      x-requirements: [PROD-001, PROD-004, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '200': { $ref: '#/components/responses/AasResource' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AAS]
      operationId: deleteShell
      summary: Delete one shell after explicit UI confirmation
      description: |
        Needs the `deleteShells` capability. Its submodels stay in the submodel
        repository. Where the server does not keep its registries and discovery
        in step and the effective sync mode is `autoCreate`, Studio then removes
        the shell's descriptor and asset links and reports each step; a failed
        step does not undo the delete (ADR 0020).
      x-requirements: [PROD-001, DATA-020, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Shell deleted, with the registry and discovery steps Studio took
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/submodel-refs:
    get:
      tags: [AAS]
      operationId: listSubmodelRefs
      summary: List the submodels a shell references, with whether each can be read
      description: Submodels are resolved through the submodel registry where there is one. `blocked` marks a descriptor endpoint outside the infrastructure, which Studio never contacts (ADR 0020).
      x-requirements: [PROD-001, DATA-001, DATA-017]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
      responses:
        '200':
          description: Submodel references in the shell's order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelRefList' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/thumbnail:
    get:
      tags: [AAS]
      operationId: getShellThumbnail
      summary: Stream the shell's default thumbnail
      description: Needs the `files` capability. Images are served inline and may be cached privately for five minutes.
      x-requirements: [PROD-001, DATA-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
      responses:
        '200':
          description: Thumbnail image
          content:
            image/*:
              schema: { type: string, format: binary }
        '204': { description: The shell has no thumbnail }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/export:
    get:
      tags: [AAS]
      operationId: exportShell
      summary: Download a shell with its submodels and concept descriptions
      description: Needs the `export` capability.
      x-requirements: [PROD-001, DATA-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [aasx, json, xml] }
      responses:
        '200':
          description: Serialized shell as an attachment named after its idShort
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/asset-administration-shell-package+xml:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
            application/xml:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/rights:
    get:
      tags: [AAS]
      operationId: getShellRights
      summary: Get the signed-in user's rights on a shell
      description: Lets the UI hide actions that would be refused. Without the `sharing` capability the target decides per request and every right is `true`.
      x-requirements: [PROD-001, SEC-005]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
      responses:
        '200':
          description: Effective rights
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveRights' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/access:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/ShellKey'
    get:
      tags: [AAS]
      operationId: getShellAccess
      summary: Get who has access to a shell (ReBAC grants)
      description: Needs the `sharing` capability. The revision is also returned as `ETag`.
      x-requirements: [SEC-005, DATA-018]
      responses:
        '200':
          description: Grants with their revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessDocument' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceShellAccess
      summary: Replace the grants of a shell as the signed-in user
      description: Needs the `sharing` capability. Without `If-Match` the request fails with `precondition_required`.
      x-requirements: [SEC-005, DATA-018]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessGrantsInput' }
      responses:
        '200':
          description: Updated grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessDocument' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/access/invitations:
    post:
      tags: [AAS]
      operationId: createShellInvitation
      summary: Create an invitation that grants a relation on the shell to whoever accepts it
      description: Needs the `sharing` capability.
      x-requirements: [SEC-005, DATA-018]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '200':
          description: Invitation token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResult' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/invitations:
    post:
      tags: [AAS]
      operationId: acceptInvitation
      summary: Accept a sharing invitation for the signed-in user
      description: Needs the `sharing` capability.
      x-requirements: [SEC-005, DATA-018]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptRequest' }
      responses:
        '204': { description: Invitation accepted }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels:
    get:
      tags: [AAS]
      operationId: listSubmodels
      summary: List submodels on their own, cursor-paged
      description: |
        The submodel view's list: the submodel registry's descriptors or the
        submodel repository's metadata (`$metadata`, without elements), as the
        `submodelListSource` capability names. Registry descriptors carry no
        `kind`. Targets that serve submodels only through their shells
        (`submodelListSource: null`) answer `unsupported_operation`.
      x-requirements: [PROD-001, PROD-002, DATA-001, DATA-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Submodel page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelSummaryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AAS]
      operationId: createSubmodel
      summary: Create a submodel without a shell
      description: |
        Creates a submodel on its own: empty, from a template or from JSON
        (not `existing`), checked with AAS Core. Needs `createResources`. Its
        descriptor is written where Studio keeps the submodel registry in step;
        `steps` reports each write. A shell references it once a reference is
        added (`POST /targets/{targetId}/shells/{shellKey}/submodel-refs`).
      x-requirements: [PROD-001, PROD-004, DATA-001, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmodelCreateRequest' }
      responses:
        '201':
          description: The new submodel's key and the steps that created it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelCreateResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/SubmodelKey'
    get:
      tags: [AAS]
      operationId: getSubmodel
      summary: Read a submodel's metadata, or the whole submodel as JSON, AAS XML or AASX
      description: |
        `content=metadata` (the default) returns the submodel without its
        elements; `content=full` the whole submodel. `format=xml` returns the
        whole submodel as AAS XML (aas-core `xmlization`) as an attachment.
        `format=aasx` returns an AASX package of the submodel with the concept
        descriptions the target has for its semantic IDs and its files; it
        cannot be combined with `at`.
        With `at` the submodel is read as it was at that point in time; this
        needs the `history` capability. `download=true` with `content=full`
        returns the JSON as an attachment (the submodel view's export).
      x-requirements: [PROD-001, DATA-001, DATA-018]
      parameters:
        - name: content
          in: query
          schema: { type: string, enum: [metadata, full], default: metadata }
        - name: format
          in: query
          schema: { type: string, enum: [json, xml, aasx], default: json }
        - name: download
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - $ref: '#/components/parameters/PointInTime'
      responses:
        '200':
          description: Submodel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelDetail' }
            application/xml:
              schema: { type: string, format: binary }
            application/asset-administration-shell-package+xml:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceSubmodel
      summary: Replace and validate one submodel using optimistic concurrency
      x-requirements: [PROD-001, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '200': { $ref: '#/components/responses/AasResource' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AAS]
      operationId: deleteSubmodel
      summary: Delete one submodel after explicit UI confirmation
      description: |
        Needs `createResources`. With `removeReferences=true`, the shells that
        reference the submodel (as `GET …/shells` finds them) lose their
        reference first, so none is left dangling; then the submodel and its
        descriptor go. Each step is reported; the first failure stops the
        later ones and becomes `partial_write` with `steps`.
      x-requirements: [PROD-001, DATA-009, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: removeReferences
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: Submodel deleted, with the references and descriptors removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/shells:
    get:
      tags: [AAS]
      operationId: getSubmodelShells
      summary: Find the shells that reference one submodel
      description: As `POST /targets/{targetId}/submodel-owners` for one submodel; the submodel view's header and delete confirmation.
      x-requirements: [PROD-001, DATA-001]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
      responses:
        '200':
          description: The referencing shells
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmodelOwners' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements:
    get:
      tags: [AAS]
      operationId: listSubmodelElements
      summary: Tree nodes below the submodel or one of its elements, within a node budget
      description: |
        Returns the children of the submodel, or of `parentElementKey`, with as
        many complete levels below them as fit into `budget` nodes, breadth
        first; the first level is always complete. A node with `hasChildren`
        and without `children` has further levels, which the UI requests when
        it is opened. With `at` the levels are read as they were at that point
        in time; this needs the `history` capability. One request per level
        would cost a full submodel read on BaSyx Go each, so small submodels
        arrive in one request (MVP-4 plan, Phase E measurements).
      x-requirements: [PROD-001, DATA-001, DATA-016, DATA-018]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - name: parentElementKey
          in: query
          schema: { $ref: '#/components/schemas/ResourceKey' }
        - $ref: '#/components/parameters/PointInTime'
        - name: budget
          in: query
          description: Maximum number of nodes in the response, except that the first level is always complete.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 2000 }
      responses:
        '200':
          description: Tree nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeNodeList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AAS]
      operationId: createSubmodelElement
      summary: Create and validate a submodel element
      x-requirements: [PROD-001, PROD-004, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmodelElementWrite' }
      responses:
        '201': { $ref: '#/components/responses/AasResourceCreated' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/SubmodelKey'
      - $ref: '#/components/parameters/ElementKey'
    get:
      tags: [AAS]
      operationId: getSubmodelElement
      summary: Read one target-scoped submodel element as JSON or AAS XML
      description: |
        JSON returns the element with its revision for writes and its
        `ancestors` for opening its path in the tree. `format=xml` returns the
        element as AAS XML as an attachment; operation variable groups have no
        XML of their own (`unsupported_operation`). With `at` the element is
        read as it was at that point in time, without a revision; this needs
        the `history` capability.
      x-requirements: [PROD-001, DATA-001, DATA-009, DATA-018]
      parameters:
        - $ref: '#/components/parameters/PointInTime'
        - name: format
          in: query
          schema: { type: string, enum: [json, xml], default: json }
      responses:
        '200':
          description: Element
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementDetail' }
            application/xml:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceSubmodelElement
      summary: Replace and validate a submodel element
      description: |
        Body `{ element }`: the element as it should be, including a new
        `idShort` (a rename; list children cannot be renamed). A container
        keeps the children it has now. `If-Match` carries the element's
        revision. Needs the `writeStructure` capability. Findings of AAS Core
        come as `validation_failed` with `violations`; a sibling with the
        same idShort is `idshort_conflict`. The answer is the element at its
        new path, with its revision.
      x-requirements: [PROD-001, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '200': { $ref: '#/components/responses/AasResource' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AAS]
      operationId: deleteSubmodelElement
      summary: Delete a submodel element with its children
      description: '`If-Match` carries the element revision. Needs the `writeStructure` capability.'
      x-requirements: [PROD-001, DATA-009, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Element deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, enum: [true] }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/moves:
    post:
      tags: [AAS]
      operationId: moveSubmodelElement
      summary: Move an element to a position among its siblings
      description: |
        Body `{ index }`. `If-Match` carries the parent's structure revision
        (`structureRevision` of the parent's detail or of the tree level), so a
        value edit elsewhere does not block it, but a concurrent add or
        reorder is `structure_conflict` (412). The answer is the element at its
        new path. Needs the `writeStructure` capability.
      x-requirements: [PROD-004, DATA-009]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/ElementKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index]
              properties:
                index: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The element at its new path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementDetail' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/value:
    put:
      tags: [AAS]
      operationId: setSubmodelElementValue
      summary: Set the value of a Property or MultiLanguageProperty
      description: '`If-Match` carries the element revision the user edited (ADR 0013). Operation variables cannot be edited separately.'
      x-requirements: [PROD-004, DATA-007, DATA-009, UX-006]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/ElementKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElementValueInput' }
      responses:
        '200':
          description: The element after the write, with its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementDetail' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/attachment:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/SubmodelKey'
      - $ref: '#/components/parameters/ElementKey'
    get:
      tags: [AAS]
      operationId: getElementAttachment
      summary: Stream the content of a File element
      description: Needs the `files` capability. Images and PDFs are shown inline in a sandbox, everything else downloads; `download` forces a download.
      x-requirements: [PROD-001, DATA-003]
      parameters:
        - name: download
          in: query
          allowEmptyValue: true
          schema: { type: string }
      responses:
        '200':
          description: File content
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceElementAttachment
      summary: Replace the content of a File element
      description: Needs the `files` capability. The request body is the file itself; its media type comes from `Content-Type`, its name from `fileName`. Files above the upload limit (100 MiB by default) are refused with `invalid_request`.
      x-requirements: [DATA-003, DATA-009, UX-006]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/FileName'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The File element after the write, with its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementDetail' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/external-file:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/SubmodelKey'
      - $ref: '#/components/parameters/ElementKey'
    get:
      tags: [AAS]
      operationId: getElementExternalFile
      summary: Fetch the file that an element names at another host
      description: >-
        For a File element whose value is an http(s) address, or a Property
        holding one. Studio reads the element as the user and fetches the
        stored address, without credentials, for browsers that may not read
        it there (CORS). Only origins listed in `STUDIO_EXTERNAL_FILE_ORIGINS`
        (desktop: any) are fetched, else `external_file_refused`; a host that
        fails gives `external_file_unavailable`. At most three redirects,
        30 s and 200 MiB. The answer always downloads (ADR 0042).
      x-requirements: [PROD-001, SEC-008]
      responses:
        '200':
          description: File content; the media type is the element's `contentType`, else the host's
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/invocations:
    post:
      tags: [AAS]
      operationId: invokeOperationElement
      summary: Invoke an Operation element synchronously or asynchronously
      description: Needs the `operations` capability. An asynchronous invocation returns a `handle` to poll.
      x-requirements: [PROD-001, DATA-003, UX-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/ElementKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvocationInput' }
      responses:
        '200':
          description: Invocation state, with outputs once completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invocation' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/elements/{elementKey}/invocations/{handle}:
    get:
      tags: [AAS]
      operationId: getOperationInvocation
      summary: Poll an asynchronous invocation
      description: Needs the `operations` capability.
      x-requirements: [PROD-001, DATA-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/ElementKey'
        - name: handle
          in: path
          required: true
          schema: { type: string, pattern: '^[\w.~-]{1,200}$' }
      responses:
        '200':
          description: Invocation state, with outputs once completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invocation' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/concept-descriptions:
    get:
      tags: [AAS]
      operationId: listConceptDescriptions
      summary: List concept descriptions where supported by the target
      description: Needs the `conceptDescriptions` capability.
      x-requirements: [DATA-003, DATA-012]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Concept description page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptDescriptionSummaryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AAS]
      operationId: createConceptDescription
      summary: Create and validate a concept description where supported
      x-requirements: [PROD-004, DATA-003, DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '201': { $ref: '#/components/responses/AasResourceCreated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/concept-descriptions/{resourceKey}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/ResourceKey'
    get:
      tags: [AAS]
      operationId: getConceptDescription
      summary: Read one concept description
      description: As JSON with its revision (`ETag`), or with `format=xml` as AAS XML (MVP-6 plan, L2).
      x-requirements: [DATA-003, DATA-009]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, xml], default: json }
      responses:
        '200': { $ref: '#/components/responses/AasResource' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AAS]
      operationId: replaceConceptDescription
      summary: Replace and validate one concept description
      x-requirements: [DATA-007, DATA-009]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasResourceWrite' }
      responses:
        '200': { $ref: '#/components/responses/AasResource' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AAS]
      operationId: deleteConceptDescription
      summary: Delete one concept description
      description: Elements that reference it keep their semantic ID.
      x-requirements: [DATA-009, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Concept description deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/concept-descriptions/{resourceKey}/usages:
    get:
      tags: [AAS]
      operationId: getConceptDescriptionUsages
      summary: Count the submodels and elements whose semantic ID names the concept description
      description: For the delete confirmation (MVP-6 plan, L5). Live targets count through the submodel repository's query endpoint; `checked` is false without it, `truncated` when counting stopped.
      x-requirements: [UX-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ResourceKey'
      responses:
        '200':
          description: Usages
          content:
            application/json:
              schema:
                type: object
                required: [checked, submodels, elements, truncated]
                properties:
                  checked: { type: boolean }
                  submodels: { type: integer, minimum: 0 }
                  elements: { type: integer, minimum: 0 }
                  truncated: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/changes:
    get:
      tags: [AAS]
      operationId: listChanges
      summary: Read recent change events of shells, submodels, and assets
      description: Needs the `changeFeed` capability, which is set only where the server announces its event feed profile (ADR 0021). Newest first; `after` reads newer events than the last one seen.
      x-requirements: [PROD-001, DATA-018]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - name: after
          in: query
          description: Only events newer than this event ID.
          schema: { type: string, maxLength: 200 }
        - name: since
          in: query
          description: Only events after this time; ignored with `after`.
          schema: { type: string, format: date-time }
        - name: subjects
          in: query
          description: Only events about these identifiers (a shell and its submodels); repeat the parameter for several.
          explode: true
          schema:
            type: array
            maxItems: 200
            items: { type: string, maxLength: 2000 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Change events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/uploads:
    post:
      tags: [AAS]
      operationId: uploadAasFile
      summary: Add the content of an AASX, JSON, or XML file to the target
      description: |
        Needs the `upload` capability. The request body is the file itself; the
        format is taken from the `fileName` extension or `Content-Type`. The
        Workspace Worker checks the file first (DATA-006), so the target only
        receives well-formed AAS content within the upload limit (100 MiB by
        default; larger files are refused with `invalid_request`). Where the
        server does not keep its registries and discovery in step and the
        effective sync mode is `autoCreate`, Studio then writes descriptors and
        asset links for the added shells and reports each step (ADR 0020).
      x-requirements: [PROD-001, DATA-006, DATA-020]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/FileName'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Shells added, with the registry and discovery steps Studio took
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/operation-invocations:
    post:
      tags: [AAS]
      operationId: invokeAasOperation
      summary: Invoke an explicitly selected AAS operation where supported
      description: Implemented in MVP-4 per Operation element as `…/elements/{elementKey}/invocations`; this target-wide form remains a draft for view bindings.
      x-requirements: [DATA-003, VIEW-004, VIEW-008, UX-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasOperationInvocationRequest' }
      responses:
        '200':
          description: Synchronous invocation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AasOperationInvocationResult' }
        '202':
          description: Asynchronous operation accepted
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/files:
    get:
      tags: [AAS]
      operationId: listSupplementaryFiles
      summary: List supplementary files available through constrained target capabilities
      x-requirements: [DATA-003, DATA-005, DATA-006, DATA-012]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Supplementary file metadata page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMetadataPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AAS]
      operationId: uploadSupplementaryFile
      summary: Stream a bounded supplementary file to the selected target
      x-requirements: [DATA-003, DATA-005, DATA-006, APP-007]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUploadRequest' }
      responses:
        '201':
          description: File stored
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMetadata' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/files/{fileKey}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - name: fileKey
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceKey' }
    get:
      tags: [AAS]
      operationId: downloadSupplementaryFile
      summary: Stream one supplementary file without exposing a native path or downstream URL
      x-requirements: [DATA-003, DATA-005, APP-007]
      responses:
        '200':
          description: Bounded file stream
          headers:
            Content-Disposition:
              schema: { type: string }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AAS]
      operationId: deleteSupplementaryFile
      summary: Delete one supplementary file
      x-requirements: [DATA-003, DATA-009, UX-003]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: File deleted }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/semantic-index:
    get:
      tags: [AAS]
      operationId: querySemanticIndex
      summary: Query bounded semantic facts for selection and applicability
      x-requirements: [APP-003, APP-009, VIEW-003, VIEW-005]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SemanticIdFilter'
        - name: contextResourceKey
          in: query
          schema: { $ref: '#/components/schemas/ResourceKey' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Semantic match page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticMatchPage' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/instances:
    post:
      tags: [AAS]
      operationId: createShellInstance
      summary: Create an instance from a shell of asset kind Type
      description: |
        A new shell with `derivedFrom` pointing to the type, asset kind
        `Instance` and copies of the type's submodels with new identifiers and
        kind `Instance` (template qualifiers removed). Submodels are written
        first, then the shell, then registries and discovery; a failure is
        `partial_write` with `steps`. Needs the `createResources` capability.
      x-requirements: [PROD-004, DATA-014]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shell: { type: object, additionalProperties: true }
                submodelIds: { type: array, items: { type: string } }
      responses:
        '201':
          description: The new shell and the steps that created it
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/shells/{shellKey}/submodel-refs/{submodelKey}:
    delete:
      tags: [AAS]
      operationId: removeShellSubmodel
      summary: Remove a submodel reference, optionally deleting the submodel
      description: '`deleteSubmodel=true` also deletes the submodel and its descriptor. Needs the `createResources` capability.'
      x-requirements: [PROD-004, UX-003]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/ShellKey'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/CsrfToken'
        - name: deleteSubmodel
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: The steps that were run
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/submodels/{submodelKey}/instance-conversions:
    post:
      tags: [AAS]
      operationId: convertSubmodelToInstance
      summary: Convert a template submodel to an instance in place
      description: Removes the template qualifiers and sets the kind to `Instance`; only submodels of kind `Template` qualify.
      x-requirements: [PROD-004]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/SubmodelKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: The submodel's metadata and the number of removed qualifiers
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/templates:
    get:
      tags: [AAS]
      operationId: listSubmodelTemplates
      summary: Submodel templates for a target
      description: The four bundled IDTA templates and Template-kind submodels of shells on the target.
      x-requirements: [PROD-004]
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/validations:
    post:
      tags: [AAS]
      operationId: validateAasJson
      summary: AAS Core findings for a JSON value, or for AAS JSON or XML text; nothing is written
      description: |
        With `value`, AAS Core checks a JSON value of the kind. With `format`
        and `text` (the *From JSON or XML* dialog), the text is parsed first:
        an element comes back as JSON in `value`, to insert; for shells,
        submodels and concept descriptions `contents` says what the text holds,
        which a copy plan then writes. Text that does not parse answers with
        one violation and no `value` or `contents`.
      x-requirements: [DATA-007, DATA-012]
      parameters:
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AasValidationRequest' }
      responses:
        '200':
          description: Findings, empty when the value is valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AasValidationResult' }
        default: { $ref: '#/components/responses/Problem' }

  /submodel-templates/{templateId}:
    get:
      tags: [AAS]
      operationId: getBundledSubmodelTemplate
      summary: The elements of a bundled submodel template
      x-requirements: [PROD-004]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The template's fields with cardinality
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/download:
    get:
      tags: [Workspaces]
      operationId: downloadWorkspace
      summary: The whole package as it is now, as an AASX package or an AAS environment in JSON or XML
      description: Unsaved changes are included; the package's own file stays as it is.
      x-requirements: [PROD-002, DEP-004, DATA-005]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [aasx, json, xml] }
      responses:
        '200':
          description: The package as a file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/undos:
    post:
      tags: [Workspaces]
      operationId: undoWorkspaceChange
      summary: Take back the last applied change of a workspace
      description: Until Save or Close. Live targets have no undo.
      x-requirements: [UX-005]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The workspace target with its undo and redo state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/redos:
    post:
      tags: [Workspaces]
      operationId: redoWorkspaceChange
      summary: Apply the change that was taken back last
      x-requirements: [UX-005]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The workspace target with its undo and redo state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List desktop-local AASX projects known to Studio
      description: This route is advertised only when the deployment context contains the `localWorkspaces` capability. It never returns native filesystem paths.
      x-requirements: [PROD-002, DEP-004, DATA-005, OPS-003, UX-004]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace project page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a local AASX project through an Electron-approved native handle
      x-requirements: [PROD-002, PROD-004, DEP-004, DATA-005, DATA-006]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' }
      responses:
        '201':
          description: Workspace created and exposed as a local target
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/imports:
    post:
      tags: [Workspaces]
      operationId: importWorkspace
      summary: Safely import an AASX package through an Electron-approved native handle
      description: Archive processing occurs in the bounded Workspace Worker and checks size, entry count, normalized paths, traversal, absolute paths, MIME/content, timeouts, and resource use.
      x-requirements: [PROD-002, DEP-004, DATA-005, DATA-006, DATA-007]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceImportRequest' }
      responses:
        '201':
          description: Package imported as a workspace
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
